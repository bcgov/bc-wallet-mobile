# Refresh E2E Sauce Builds
#
# Sauce Labs app storage deletes files after 60 days of inactivity. This
# workflow re-uploads the shipped builds the e2e upgrade suites start from, on
# a schedule, to keep them available. GitHub Release assets are the durable
# origin; Sauce storage is a cache of them. A shipped build lives under ONE
# name in both places, BCSC-v<version>.apk / .ipa, attached to its release by
# "Publish Release E2E Builds" (or by hand — e2e/apps/README.md).
#
# The manifest is e2e/upgrade-sources.json — the same list the weekly upgrade
# run (e2e-upgrade-weekly.yml) and the wdio upgrade configs read: one entry per
# version with the release that carries its assets and the platforms it shipped
# on. Adding a version = one manifest entry, plus its release assets.
#
# A release missing an asset fails that entry loudly; the other entries still
# refresh. Attach the binary, then re-run.
#
# Sauce Storage behaviour: uploading with the same `name` creates a new
# version in the same app group, resetting the retention clock.
# `storage:filename=<name>` always resolves to the newest upload of that
# filename, so the upgrade configs need no changes.
name: Refresh E2E Sauce Builds

on:
  schedule:
    # 1st of every month at 08:00 UTC — well within the 60-day window
    - cron: '0 8 1 * *'
  workflow_dispatch: {}

jobs:
  plan:
    name: Read the manifest
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      sources: ${{ steps.read.outputs.sources }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: e2e/upgrade-sources.json
          sparse-checkout-cone-mode: false

      - name: List the versions
        id: read
        run: |
          sources=$(jq -c '[.sources[] | {name: ("BCSC-v" + .version), version, release_tag, platforms}]' e2e/upgrade-sources.json)
          if [ "$(jq 'length' <<<"$sources")" = "0" ]; then
            echo "::error::e2e/upgrade-sources.json lists no versions"
            exit 1
          fi
          echo "sources=$sources" >> "$GITHUB_OUTPUT"
          jq -r '.[] | "\(.name) ← \(.release_tag) (\(.platforms | join(", ")))"' <<<"$sources"

  refresh:
    name: Refresh ${{ matrix.source.name }}
    needs: [plan]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(needs.plan.outputs.sources) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/workflows/actions/upload-to-sauce-storage

      - name: Download ${{ matrix.source.name }}.* from the ${{ matrix.source.release_tag }} release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ matrix.source.release_tag }}
          NAME: ${{ matrix.source.name }}
          PLATFORMS: ${{ join(matrix.source.platforms, ' ') }}
        run: |
          assets=$(gh api "repos/${{ github.repository }}/releases/tags/${RELEASE_TAG}" --jq '[.assets[].name]')
          patterns=()
          for platform in $PLATFORMS; do
            case "$platform" in
              android) ext=apk ;;
              ios) ext=ipa ;;
              *)
                echo "::error::e2e/upgrade-sources.json: unknown platform '${platform}' on ${NAME}"
                exit 1
                ;;
            esac
            if ! jq -e --arg n "${NAME}.${ext}" 'index($n)' <<<"$assets" >/dev/null; then
              echo "::error::Release ${RELEASE_TAG} has no ${NAME}.${ext} — attach it (e2e/apps/README.md, 'Upgrade-source binaries') and re-run"
              exit 1
            fi
            patterns+=(--pattern "${NAME}.${ext}")
          done
          gh release download "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            "${patterns[@]}" \
            --dir dl
          ls -la dl

      - name: Load SauceLabs secrets from 1Password
        id: op_saucelabs
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SAUCE_USERNAME: op://bcsc-mobile-app-cd/saucelabs/username
          SAUCE_ACCESS_KEY: op://bcsc-mobile-app-cd/saucelabs/credential

      - name: Upload ${{ matrix.source.name }}.apk to SauceLabs
        if: contains(matrix.source.platforms, 'android')
        id: upload_android
        uses: ./.github/workflows/actions/upload-to-sauce-storage
        with:
          file: dl/${{ matrix.source.name }}.apk
          name: ${{ matrix.source.name }}.apk
          description: e2e upgrade source — ${{ matrix.source.release_tag }} / ${{ matrix.source.name }}.apk
          sauce_username: ${{ steps.op_saucelabs.outputs.SAUCE_USERNAME }}
          sauce_access_key: ${{ steps.op_saucelabs.outputs.SAUCE_ACCESS_KEY }}

      - name: Upload ${{ matrix.source.name }}.ipa to SauceLabs
        if: contains(matrix.source.platforms, 'ios')
        id: upload_ios
        uses: ./.github/workflows/actions/upload-to-sauce-storage
        with:
          file: dl/${{ matrix.source.name }}.ipa
          name: ${{ matrix.source.name }}.ipa
          description: e2e upgrade source — ${{ matrix.source.release_tag }} / ${{ matrix.source.name }}.ipa
          sauce_username: ${{ steps.op_saucelabs.outputs.SAUCE_USERNAME }}
          sauce_access_key: ${{ steps.op_saucelabs.outputs.SAUCE_ACCESS_KEY }}

      - name: Summarise
        env:
          NAME: ${{ matrix.source.name }}
          RELEASE_TAG: ${{ matrix.source.release_tag }}
          PLATFORMS: ${{ join(matrix.source.platforms, ' ') }}
          ANDROID_VERSION: ${{ steps.upload_android.outputs.app_version }}
          ANDROID_BUILD: ${{ steps.upload_android.outputs.build_number }}
          IOS_VERSION: ${{ steps.upload_ios.outputs.app_version }}
          IOS_BUILD: ${{ steps.upload_ios.outputs.build_number }}
        run: |
          {
            echo "| Sauce name | Release | App version | Build |"
            echo "| --- | --- | --- | --- |"
            for platform in $PLATFORMS; do
              if [ "$platform" = "android" ]; then
                echo "| \`${NAME}.apk\` | ${RELEASE_TAG} | ${ANDROID_VERSION:-?} | ${ANDROID_BUILD:-?} |"
              else
                echo "| \`${NAME}.ipa\` | ${RELEASE_TAG} | ${IOS_VERSION:-?} | ${IOS_BUILD:-?} |"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
