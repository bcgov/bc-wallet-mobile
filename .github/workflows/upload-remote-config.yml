name: Upload Remote Config

# on:
#   workflow_run:
#     workflows: ["Code Quality"]
#     types: [completed]
#     branches: [main]
on:
  pull_request:               # TEMP: swap back to workflow_run once verified
    branches: [main]

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      REMOTE_CONFIG_SERVER_URL: idim.objectstore.gov.bc.ca
      REMOTE_CONFIG_BUCKET_NAME: bcsc-mobile-prod-remote-configuration
      REMOTE_CONFIG_FILE_NAME: prod-remote-config.json
    steps:
      - uses: actions/checkout@v4

      # Secrets are being consolidated into the bcsc-mobile-app-cd 1Password vault;
      # OP_SERVICE_ACCOUNT_TOKEN is the single bootstrap secret that stays in GitHub.
      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@e544b780808654ba8ceba5fb2fe2897103d92ff4 # v5.0.0
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          AWS_ACCESS_KEY_ID: op://bcsc-mobile-app-cd/remote-config-object-storage/access_key_id
          AWS_SECRET_ACCESS_KEY: op://bcsc-mobile-app-cd/remote-config-object-storage/secret_access_key

      - name: Check if remote config changed
        id: changed
        run: |
          REMOTE_ETAG=$(aws s3api head-object \
            --bucket "$REMOTE_CONFIG_BUCKET_NAME" \
            --key "$REMOTE_CONFIG_FILE_NAME" \
            --endpoint-url "https://$REMOTE_CONFIG_SERVER_URL" \
            --query ETag --output text 2>/dev/null | tr -d '"')
          LOCAL_MD5=$(md5sum app/src/remote-config/prod-remote-config.json | awk '{print $1}')

          if [ "$REMOTE_ETAG" = "$LOCAL_MD5" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to ObjectStore
        if: steps.changed.outputs.changed == 'true'
        run: |
          aws s3 cp ./app/src/remote-config/prod-remote-config.json \
          s3://"$REMOTE_CONFIG_BUCKET_NAME"/"$REMOTE_CONFIG_FILE_NAME" \
          --endpoint-url "https://$REMOTE_CONFIG_SERVER_URL"
