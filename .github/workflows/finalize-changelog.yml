# Adds any entries from .changes/*.md into CHANGELOG.md and opens a PR with
# the result.
#
# No build or version to resolve: this only reads .changes/*.md as of the
# dispatched ref (main, or a release branch), so it just checks that out
# directly. Each run gets its own dated heading — meant to run once, right
# before a release candidate is cut
name: Finalize Changelog

on:
  workflow_dispatch:

permissions: {}

jobs:
  finalize:
    name: Finalize changelog
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check the branch is publishable
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "${BRANCH}" != "main" ] && [[ "${BRANCH}" != release/* ]]; then
            echo "::error::Finalize Changelog can only run from 'main' or a 'release/*' branch. You ran it from '${BRANCH}'."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: ./.github/workflows/actions/setup-node

      - name: Install dependencies
        run: yarn install --immutable

      # --allow-empty makes "nothing pending" a clean no-op instead of a
      # failure: this workflow runs on a schedule/whim, not in response to
      # a specific change, so an empty .changes/ is the expected common case.
      - name: Assemble changelog
        run: node scripts/changelog/index.mjs assemble --allow-empty

      - name: Open the PR
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md .changes

          if git diff --cached --quiet; then
            echo "No pending .changes/ entries — nothing to do."
            exit 0
          fi

          branch="release/changelog-${RUN_NUMBER}"
          git switch -c "${branch}"
          git commit -s -m "chore: finalize changelog"
          git push origin "${branch}"

          pr_url=$(gh pr create \
            --title "chore: finalize changelog" \
            --body "Folds pending \`.changes/*.md\` entries into \`CHANGELOG.md\`. Generated by **Finalize Changelog** — nothing to review by hand beyond the changelog content itself." \
            --base main \
            --head "${branch}")
          echo "Opened ${pr_url}"

          # This PR only ever touches CHANGELOG.md/.changes/**, so it has
          # nothing to add a changelog entry about.
          gh pr edit "${pr_url}" --add-label status/skip-changelog
