name: Code Quality

on:
  push:
    branches: [main] # needed so codecov gets BASE coverage for comparison
  pull_request:
    branches: [main, 'release/**']
    types: [opened, synchronize, reopened, labeled]
  merge_group:

jobs:
  typecheck-test:
    runs-on: macos-26
    name: Build, Typecheck, Test & Coverage
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Dependabot/fork runs get no repo secrets, so gate only the
      # secret-dependent steps below on this — build/typecheck/test stay
      # unconditional (job-level `if:` can't read `secrets`).
      - name: Check secret availability
        id: secrets-check
        if: always()
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          if [ -n "$OP_SERVICE_ACCOUNT_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "OP_SERVICE_ACCOUNT_TOKEN unavailable (Dependabot or fork run); skipping 1Password load and codecov upload."
          fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - uses: ./.github/workflows/actions/setup-node

      - name: Cache node_modules
        id: cache-node
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Cache bcsc-core build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/bcsc-core/lib
          key: ${{ runner.os }}-bcsc-core-build-${{ hashFiles('packages/bcsc-core/src/**') }}
          restore-keys: |
            ${{ runner.os }}-bcsc-core-build-

      - name: Build packages
        run: yarn build

      - name: Typecheck
        run: yarn typecheck

      - name: Run tests and generate coverage report
        run: yarn coverage

      # Secrets are being consolidated into the bcsc-mobile-app-cd 1Password vault;
      # OP_SERVICE_ACCOUNT_TOKEN is the single bootstrap secret that stays in GitHub.
      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CODECOV_TOKEN: op://bcsc-mobile-app-cd/codecov/credential
        if: always() && steps.secrets-check.outputs.available == 'true' && !startsWith(github.base_ref, 'release/') && !startsWith(github.ref_name, 'release/')

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # (v7.0.0) pinning for SonarQube
        with:
          token: ${{ env.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true
        if: always() && steps.secrets-check.outputs.available == 'true' && !startsWith(github.base_ref, 'release/') && !startsWith(github.ref_name, 'release/')

  lint-format:
    runs-on: macos-26
    name: Lint & Format
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - uses: ./.github/workflows/actions/setup-node

      - name: Restore node_modules cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install formatting and linting tools
        run: brew install clang-format ktlint

      # Pinned: runner images ship different SwiftFormat versions, and 0.64 adds default rules that fail lint
      - name: Install SwiftFormat
        env:
          SWIFTFORMAT_VERSION: 0.63.1
        run: |
          curl --proto "=https" --tlsv1.2 -sSfL -o "$RUNNER_TEMP/swiftformat.zip" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
          unzip -q -o "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/swiftformat"
          echo "$RUNNER_TEMP/swiftformat" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/swiftformat/swiftformat" --version

      - name: Lint
        run: yarn lint

      - name: Format check
        run: yarn format:check

  e2e-typecheck:
    runs-on: ubuntu-latest
    name: E2E Typecheck
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/workflows/actions/setup-node

      # e2e is not a root workspace member, so it installs from its own lockfile into its own cache.
      - name: Cache e2e Yarn cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: e2e/.yarn/cache
          key: ${{ runner.os }}-yarn-e2e-${{ hashFiles('e2e/yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-e2e-

      # --mode=skip-build disables Yarn's lifecycle scripts, which are on by default in Yarn v2+.
      # Several e2e devDependencies fetch from the network on postinstall (edgedriver/geckodriver
      # download browsers, appium auto-installs extensions); a typecheck needs none of them.
      - name: Install dependencies
        working-directory: e2e
        run: yarn install --immutable --mode=skip-build

      # The suite compiles against app/src/test-ids/registry.ts, so a testID key renamed or deleted
      # app-side fails here at PR time instead of minutes into a Sauce run behind a build cycle.
      - name: Typecheck
        working-directory: e2e
        run: yarn typecheck

      # E2E helper contracts (IDCheck circuit breaker and live-call exits), without devices or secrets.
      - name: Unit tests
        working-directory: e2e
        run: yarn test:unit

      # The nightly brief maps every checkpoint by its it() title and proves its rules on fixture reports.
      # A renamed checkpoint, or a map/fixture left behind by a rename, fails here at PR time instead of
      # on the next nightly, where it also blocks the brief from rendering.
      - name: Brief coverage map
        working-directory: e2e
        run: yarn brief:check

  test-ios:
    runs-on: macos-26
    name: Native Tests (iOS)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve iOS Simulator destination
        id: sim
        run: |
          SIM_NAME=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for runtime in sorted(devices.keys(), reverse=True):
            if 'iOS' in runtime:
              for d in devices[runtime]:
                if 'iPhone' in d['name']:
                  print(d['name']); sys.exit(0)
          sys.exit(1)")
          echo "destination=platform=iOS Simulator,name=$SIM_NAME,OS=latest" >> "$GITHUB_OUTPUT"

      - name: Run iOS tests
        working-directory: packages/bcsc-core
        run: |
          xcodebuild test \
            -scheme BcscCoreTests-Package \
            -destination '${{ steps.sim.outputs.destination }}' \
            -skipPackagePluginValidation

  test-android:
    runs-on: macos-26
    name: Native Tests (Android)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: 17

      - name: Cache Gradle dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('packages/bcsc-core/android/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Run Android tests
        working-directory: packages/bcsc-core/android
        run: ./gradlew test
