name: Code Quality

on:
  push:
    branches: [main] # needed so codecov gets BASE coverage for comparison
  pull_request:
    branches: [main, 'release/**']
    types: [opened, synchronize, reopened, labeled]
  merge_group:

jobs:
  typecheck-test:
    runs-on: macos-26
    name: Build, Typecheck, Test & Coverage
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Dependabot runs read GitHub's separate Dependabot secrets store,
      # so OP_SERVICE_ACCOUNT_TOKEN (and fork PRs, which never get repo
      # secrets at all) arrive empty here. The `secrets` context isn't
      # readable in job-level `if:`, so availability is computed in a step
      # and used to gate only the secret-dependent steps below — build,
      # typecheck and test stay unconditional so this job still gates the
      # merge on the real validation.
      - name: Check secret availability
        id: secrets-check
        if: always()
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          if [ -n "$OP_SERVICE_ACCOUNT_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "OP_SERVICE_ACCOUNT_TOKEN unavailable (Dependabot or fork run); skipping 1Password load and codecov upload."
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - uses: ./.github/workflows/actions/setup-node

      - name: Cache node_modules
        id: cache-node
        uses: actions/cache@v6
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Cache bcsc-core build output
        uses: actions/cache@v6
        with:
          path: packages/bcsc-core/lib
          key: ${{ runner.os }}-bcsc-core-build-${{ hashFiles('packages/bcsc-core/src/**') }}
          restore-keys: |
            ${{ runner.os }}-bcsc-core-build-

      - name: Build packages
        run: yarn build

      - name: Typecheck
        run: yarn typecheck

      - name: Run tests and generate coverage report
        run: yarn coverage

      # Secrets are being consolidated into the bcsc-mobile-app-cd 1Password vault;
      # OP_SERVICE_ACCOUNT_TOKEN is the single bootstrap secret that stays in GitHub.
      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CODECOV_TOKEN: op://bcsc-mobile-app-cd/codecov/credential
        if: always() && steps.secrets-check.outputs.available == 'true' && !startsWith(github.base_ref, 'release/') && !startsWith(github.ref_name, 'release/')

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # (v7.0.0) pinning for SonarQube
        with:
          token: ${{ env.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true
        if: always() && steps.secrets-check.outputs.available == 'true' && !startsWith(github.base_ref, 'release/') && !startsWith(github.ref_name, 'release/')

  lint-format:
    runs-on: macos-26
    name: Lint & Format
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - uses: ./.github/workflows/actions/setup-node

      - name: Restore node_modules cache
        uses: actions/cache@v6
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install formatting and linting tools
        run: brew install swiftformat clang-format ktlint

      - name: Lint
        run: yarn lint

      - name: Format check
        run: yarn format:check

  test-ios:
    runs-on: macos-26
    name: Native Tests (iOS)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Resolve iOS Simulator destination
        id: sim
        run: |
          SIM_NAME=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for runtime in sorted(devices.keys(), reverse=True):
            if 'iOS' in runtime:
              for d in devices[runtime]:
                if 'iPhone' in d['name']:
                  print(d['name']); sys.exit(0)
          sys.exit(1)")
          echo "destination=platform=iOS Simulator,name=$SIM_NAME,OS=latest" >> "$GITHUB_OUTPUT"

      - name: Run iOS tests
        working-directory: packages/bcsc-core
        run: |
          xcodebuild test \
            -scheme BcscCoreTests-Package \
            -destination '${{ steps.sim.outputs.destination }}' \
            -skipPackagePluginValidation

  test-android:
    runs-on: macos-26
    name: Native Tests (Android)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - name: Cache Gradle dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('packages/bcsc-core/android/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Run Android tests
        working-directory: packages/bcsc-core/android
        run: ./gradlew test
