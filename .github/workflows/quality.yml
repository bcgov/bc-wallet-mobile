name: Code Quality

on:
  push:
    branches: [main] # needed so codecov gets BASE coverage for comparison
    paths-ignore:
      - CHANGELOG.md
      - .changes/**
  pull_request:
    branches: [main, 'release/**']
    types: [opened, synchronize, reopened, labeled]
  merge_group:

jobs:
  typecheck-test:
    runs-on: macos-26
    name: Build, Typecheck, Test & Coverage
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Dependabot/fork runs get no repo secrets, so gate only the
      # secret-dependent steps below on this — build/typecheck/test stay
      # unconditional (job-level `if:` can't read `secrets`).
      - name: Check secret availability
        id: secrets-check
        if: always()
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          if [ -n "$OP_SERVICE_ACCOUNT_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "OP_SERVICE_ACCOUNT_TOKEN unavailable (Dependabot or fork run); skipping 1Password load and codecov upload."
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - uses: ./.github/workflows/actions/setup-node

      - name: Cache node_modules
        id: cache-node
        uses: actions/cache@v6
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Cache bcsc-core build output
        uses: actions/cache@v6
        with:
          path: packages/bcsc-core/lib
          key: ${{ runner.os }}-bcsc-core-build-${{ hashFiles('packages/bcsc-core/src/**') }}
          restore-keys: |
            ${{ runner.os }}-bcsc-core-build-

      - name: Build packages
        run: yarn build

      - name: Typecheck
        run: yarn typecheck

      - name: Run tests and generate coverage report
        run: yarn coverage

      # Secrets are being consolidated into the bcsc-mobile-app-cd 1Password vault;
      # OP_SERVICE_ACCOUNT_TOKEN is the single bootstrap secret that stays in GitHub.
      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CODECOV_TOKEN: op://bcsc-mobile-app-cd/codecov/credential
        if: always() && steps.secrets-check.outputs.available == 'true' && !startsWith(github.base_ref, 'release/') && !startsWith(github.ref_name, 'release/')

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # (v7.0.0) pinning for SonarQube
        with:
          token: ${{ env.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true
        if: always() && steps.secrets-check.outputs.available == 'true' && !startsWith(github.base_ref, 'release/') && !startsWith(github.ref_name, 'release/')

  lint-format:
    runs-on: macos-26
    name: Lint & Format
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - uses: ./.github/workflows/actions/setup-node

      - name: Restore node_modules cache
        uses: actions/cache@v6
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install formatting and linting tools
        run: brew install swiftformat clang-format ktlint

      - name: Lint
        run: yarn lint

      - name: Format check
        run: yarn format:check

  test-ios:
    runs-on: macos-26
    name: Native Tests (iOS)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Resolve iOS Simulator destination
        id: sim
        run: |
          SIM_NAME=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for runtime in sorted(devices.keys(), reverse=True):
            if 'iOS' in runtime:
              for d in devices[runtime]:
                if 'iPhone' in d['name']:
                  print(d['name']); sys.exit(0)
          sys.exit(1)")
          echo "destination=platform=iOS Simulator,name=$SIM_NAME,OS=latest" >> "$GITHUB_OUTPUT"

      - name: Run iOS tests
        working-directory: packages/bcsc-core
        run: |
          xcodebuild test \
            -scheme BcscCoreTests-Package \
            -destination '${{ steps.sim.outputs.destination }}' \
            -skipPackagePluginValidation

  test-android:
    runs-on: macos-26
    name: Native Tests (Android)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - name: Cache Gradle dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('packages/bcsc-core/android/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Run Android tests
        working-directory: packages/bcsc-core/android
        run: ./gradlew test

  changelog-entry:
    name: Changelog Entry
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    # Also runs on merge_group (required for ALLGREEN grouping in the merge
    # queue) but short-circuits to success there: PR labels aren't queryable
    # on merge_group, and a queued PR already passed this check as a
    # pull_request run before it could be queued.
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - name: Verify a .changes/*.md file was added
        if: >-
          github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
        run: |
          added=$(git diff --diff-filter=A --name-only "origin/${GITHUB_BASE_REF}"...HEAD -- '.changes/*.md')
          if [ -z "$added" ]; then
            echo "::error::No .changes/*.md file added in this PR. Add one describing your change for a non-technical reader (see CONTRIBUTING.md), or apply the 'skip-changelog' label if this PR doesn't need one."
            exit 1
          fi
          echo "Found changelog entry: $added"
