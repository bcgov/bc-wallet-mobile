name: Code Quality

on:
  push:
    branches: [main] # needed so codecov gets BASE coverage for comparison
  pull_request:
    branches: [main, 'release/**']
    types: [opened, synchronize, reopened, labeled]
  merge_group:

jobs:
  typecheck-test:
    runs-on: macos-26
    name: Build, Typecheck, Test & Coverage
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Dependabot/fork runs get no repo secrets, so gate only the
      # secret-dependent steps below on this — build/typecheck/test stay
      # unconditional (job-level `if:` can't read `secrets`).
      - name: Check secret availability
        id: secrets-check
        if: always()
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          if [ -n "$OP_SERVICE_ACCOUNT_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "OP_SERVICE_ACCOUNT_TOKEN unavailable (Dependabot or fork run); skipping 1Password load and codecov upload."
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - uses: ./.github/workflows/actions/setup-node

      - name: Cache node_modules
        id: cache-node
        uses: actions/cache@v6
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Cache bcsc-core build output
        uses: actions/cache@v6
        with:
          path: packages/bcsc-core/lib
          key: ${{ runner.os }}-bcsc-core-build-${{ hashFiles('packages/bcsc-core/src/**') }}
          restore-keys: |
            ${{ runner.os }}-bcsc-core-build-

      - name: Build packages
        run: yarn build

      - name: Typecheck
        run: yarn typecheck

      - name: Run tests and generate coverage report
        run: yarn coverage

      # Secrets are being consolidated into the bcsc-mobile-app-cd 1Password vault;
      # OP_SERVICE_ACCOUNT_TOKEN is the single bootstrap secret that stays in GitHub.
      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CODECOV_TOKEN: op://bcsc-mobile-app-cd/codecov/credential
        if: always() && steps.secrets-check.outputs.available == 'true' && !startsWith(github.base_ref, 'release/') && !startsWith(github.ref_name, 'release/')

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # (v7.0.0) pinning for SonarQube
        with:
          token: ${{ env.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true
        if: always() && steps.secrets-check.outputs.available == 'true' && !startsWith(github.base_ref, 'release/') && !startsWith(github.ref_name, 'release/')

  lint-format:
    runs-on: macos-26
    name: Lint & Format
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - uses: ./.github/workflows/actions/setup-node

      - name: Restore node_modules cache
        uses: actions/cache@v6
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      # swiftformat and ktlint ship preinstalled on the GitHub macOS image, so
      # `brew install` is a no-op and the version is whatever that image happens to
      # carry. Runners in the pool disagree (swiftformat 0.62.1 vs 0.63.0 on
      # 2026-09-03), which made lint pass or fail on identical code depending on
      # which machine the job drew. Both formatters gate the build, so both are
      # installed from pinned upstream releases and checksummed.
      #
      # clang-format and ccache come from the Brewfile: neither can fail the build on
      # a rule change, and Homebrew cannot install a specific version anyway.
      - name: Install formatting and linting tools
        env:
          SWIFTFORMAT_VERSION: '0.63.0'
          # sha256 of each pinned download. Bump the version and its hash together.
          SWIFTFORMAT_SHA256: '28c7802e11fa5ae113d903066439c6bb1be20a8ac1ad9709c42616a7e273fb0f'
          KTLINT_VERSION: '1.8.0'
          KTLINT_SHA256: 'a3fd620207d5c40da6ca789b95e7f823c54e854b7fade7f613e91096a3706d75'
        run: |
          set -euo pipefail
          brew bundle --file=Brewfile

          # --proto/--proto-redir keep a redirect from downgrading a download to http.
          curl -fsSL --proto '=https' --proto-redir '=https' \
            --retry 3 --retry-delay 2 --retry-connrefused -o /tmp/swiftformat.zip \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
          echo "${SWIFTFORMAT_SHA256}  /tmp/swiftformat.zip" | shasum -a 256 -c -
          unzip -qo /tmp/swiftformat.zip -d /tmp/swiftformat
          sudo install -m 0755 /tmp/swiftformat/swiftformat /usr/local/bin/swiftformat
          swiftformat --version

          curl -fsSL --proto '=https' --proto-redir '=https' \
            --retry 3 --retry-delay 2 --retry-connrefused -o /tmp/ktlint \
            "https://github.com/pinterest/ktlint/releases/download/${KTLINT_VERSION}/ktlint"
          echo "${KTLINT_SHA256}  /tmp/ktlint" | shasum -a 256 -c -
          sudo install -m 0755 /tmp/ktlint /usr/local/bin/ktlint
          ktlint --version

      - name: Lint
        run: yarn lint

      - name: Format check
        run: yarn format:check

  test-ios:
    runs-on: macos-26
    name: Native Tests (iOS)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Resolve iOS Simulator destination
        id: sim
        run: |
          SIM_NAME=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for runtime in sorted(devices.keys(), reverse=True):
            if 'iOS' in runtime:
              for d in devices[runtime]:
                if 'iPhone' in d['name']:
                  print(d['name']); sys.exit(0)
          sys.exit(1)")
          echo "destination=platform=iOS Simulator,name=$SIM_NAME,OS=latest" >> "$GITHUB_OUTPUT"

      - name: Run iOS tests
        working-directory: packages/bcsc-core
        run: |
          xcodebuild test \
            -scheme BcscCoreTests-Package \
            -destination '${{ steps.sim.outputs.destination }}' \
            -skipPackagePluginValidation

  test-android:
    runs-on: macos-26
    name: Native Tests (Android)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 17

      - name: Cache Gradle dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('packages/bcsc-core/android/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Run Android tests
        working-directory: packages/bcsc-core/android
        run: ./gradlew test
