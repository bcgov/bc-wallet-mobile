name: Maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *" # Runs every day at 12 PM (noon) UTC, which is 4 AM PST
jobs:
  prune:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      # contents: write # only for delete-branch option
      issues: write
      pull-requests: write
    name: Issue and PR
    steps:
      - name: Prune stale issues
        uses: actions/stale@v10
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operations-per-run: 50
          days-before-stale: 270 # 9 months
          days-before-close: 30 # 1 month
          stale-issue-label: stale
          exempt-issue-labels: status/external-dependency
          exempt-pr-labels: dependencies
          stale-issue-message: >
            This issue has been inactive for a while, so it's
            been marked as "stale." If you're still working on
            it or it's still important, please leave a comment
            to keep it open and remove the "stale" label. Thanks!
          stale-pr-message: >
            This pull request hasn't had any recent activity,
            so it's been marked as "stale."  If you're still
            working on it or if it's still important, just keep
            making commits (code changes) and remove the "stale"
            label. Thanks!
          close-issue-message: >
            This issue has been automatically closed because
            there hasn't been any recent activity. If it's
            still relevant, please feel free to reopen it.
          close-pr-message: >
            This pull request has been automatically closed due
            to inactivity. If it's still relevant, please
            feel free to reopen it.

  prune-saucelabs:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: read
    name: SauceLabs Storage
    steps:
      - uses: actions/checkout@v7

      - name: Setup NodeJS
        uses: ./.github/workflows/actions/setup-node

      - name: Load SauceLabs secrets from 1Password
        id: op_saucelabs
        uses: 1password/load-secrets-action@e544b780808654ba8ceba5fb2fe2897103d92ff4 # v5.0.0
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SAUCE_USERNAME: op://bcsc-mobile-app-cd/saucelabs/username
          SAUCE_ACCESS_KEY: op://bcsc-mobile-app-cd/saucelabs/credential

      - name: Prune old PR builds from SauceLabs
        env:
          SAUCE_USERNAME: ${{ steps.op_saucelabs.outputs.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ steps.op_saucelabs.outputs.SAUCE_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/saucelabs-prune-builds.mjs --delete
