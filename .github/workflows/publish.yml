# Publishes an EXISTING build to the app stores. This workflow never builds:
# it takes the artifacts produced by an earlier `Native Build & Test` run and
# uploads those, so what a tester installs is byte-for-byte what CI produced.
#
# Merging builds artifacts and publishes nothing. Every destination —
# App Store Connect, Google Play and Firebase App Distribution — is reached
# only from here.
#
# `ring` is the audience. ring-0 is the team and always publishes, without
# approval. Picking a higher ring publishes every ring up to it, each behind
# its own environment approval, in order. See docs/releases.md.
name: Publish

on:
  workflow_dispatch:
    inputs:
      ring:
        description: 'How far to publish. ring-0 (the team) always goes; this picks how much further, and each ring on the way needs its own approval.'
        required: false
        default: ring-2
        type: choice
        options:
          - ring-1
          - ring-2
          - ring-3
          - ring-4
      build_number:
        description: 'Build number to publish. Leave blank for the most recent publishable build on this branch.'
        required: false
        type: string
      targets:
        description: 'Which stores to publish to. Use one to retry a single store after a partial failure.'
        required: false
        default: all
        type: choice
        options:
          - all
          - apple-store
          - google-store
          - firebase

# Never cancel a publish part-way through: the stores are not transactional.
# A run waiting for approval holds this group, so approvers should approve or
# reject promptly — rejecting frees the queue for the next publish. `queue:
# max` lets multiple runs wait their turn (in start order) instead of a new
# pending run silently cancelling whatever was already queued.
concurrency:
  group: publish
  cancel-in-progress: false
  queue: max

permissions: {}

jobs:
  # ─── Resolve which build to publish ─────────────────────────────────
  # A run being green is not enough. When a push's final commit touches
  # nothing relevant, early-exit-check skips the builds and the run still
  # reports success — with no artifacts to publish. So candidate runs are
  # filtered on actually having unexpired artifacts.
  #
  # iOS and Android build independently, so the resolver reports a separate
  # variant list per artifact kind and each job below runs only for the
  # variants whose artifact actually exists.
  resolve-build:
    name: Resolve build
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    outputs:
      run_id: ${{ steps.resolve.outputs.run_id }}
      run_number: ${{ steps.resolve.outputs.run_number }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      ipa_variants: ${{ steps.resolve.outputs.ipa_variants }}
      aab_variants: ${{ steps.resolve.outputs.aab_variants }}
      apk_variants: ${{ steps.resolve.outputs.apk_variants }}
      widen_ipa_variants: ${{ steps.resolve.outputs.widen_ipa_variants }}
      widen_aab_variants: ${{ steps.resolve.outputs.widen_aab_variants }}
      widen_apk_variants: ${{ steps.resolve.outputs.widen_apk_variants }}
      reached_rings: ${{ steps.resolve.outputs.reached_rings }}
      has_widening: ${{ steps.resolve.outputs.has_widening }}
    steps:
      # A feature branch can produce a perfectly good build, but shipping one
      # to real testers is almost always a mistake. Releases come off main or
      # a release branch; nothing else is publishable.
      - name: Check the branch is publishable
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "${BRANCH}" != "main" ] && [[ "${BRANCH}" != release/* ]]; then
            echo "::error::Publish can only run from 'main' or a 'release/*' branch. You ran it from '${BRANCH}'. Re-run it from main, or cut a release branch (e.g. release/v4.1.x) first — see docs/releases.md."
            exit 1
          fi
          echo "Publishing from ${BRANCH}"

      # Deliberately the dispatched ref, not the default branch: the scripts
      # and composite actions have to match the workflow file being run, and
      # dispatching from a branch is the only way to test a change to this
      # workflow.
      - uses: actions/checkout@v7

      - name: Resolve build
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RING: ${{ inputs.ring }}
          TARGETS: ${{ inputs.targets }}
          REQUESTED_BUILD: ${{ inputs.build_number }}
        run: python3 .github/scripts/resolve_publishable_build.py

  # ─── ring-0: the team ───────────────────────────────────────────────
  # These run without approval. ring-0 is also the only upload: Apple rejects
  # a duplicate binary and Play rejects a duplicate version code, so every
  # higher ring can only widen who sees what these jobs put there.
  #
  # There is no TestFlight job for ring-0. `ring 0` is an internal group, and
  # Apple hands internal testers every build once it finishes processing, so
  # assigning one is rejected outright: "Cannot add internal group to a
  # build". Export compliance comes from Info.plist, so nothing is left to do.

  apple-upload:
    name: 'Apple upload - ${{ matrix.variant }}'
    needs: resolve-build
    if: >-
      (inputs.targets == 'all' || inputs.targets == 'apple-store') &&
      needs.resolve-build.outputs.ipa_variants != '[]'
    runs-on: macos-26
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.resolve-build.outputs.ipa_variants) }}
    steps:
      - name: Download IPA
        uses: actions/download-artifact@v8
        with:
          name: ios-${{ matrix.variant }}.ipa
          path: ${{ runner.temp }}/artifact
          run-id: ${{ needs.resolve-build.outputs.run_id }}
          github-token: ${{ github.token }}

      - uses: actions/checkout@v7

      - name: Use the build's variant config
        uses: ./.github/workflows/actions/use-build-variant-config
        with:
          head_sha: ${{ needs.resolve-build.outputs.head_sha }}

      - name: Load variant config
        uses: ./.github/workflows/actions/load-variant-config
        with:
          variant: ${{ matrix.variant }}

      - name: Generate App Store Connect token
        id: jwt
        uses: ./.github/workflows/actions/asc-jwt
        with:
          app_store_connect_issuer_id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          app_store_connect_key_identifier: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER_95 }}
          app_store_connect_private_key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_95 }}

      # Publishing a build that is already there must be a no-op, so a run
      # that only widens the audience does not fail on the upload.
      - name: Is the build already in App Store Connect?
        id: existing
        uses: ./.github/workflows/actions/asc-build-lookup
        with:
          asc_token: ${{ steps.jwt.outputs.token }}
          bundle_id: ${{ env.IOS_BUNDLE_ID }}
          version_name: ${{ env.APP_VERSION }}
          version_code: ${{ needs.resolve-build.outputs.run_number }}

      # Only the API key is needed. Uploading does not sign anything, so the
      # keychain and provisioning profile that a build requires are not built.
      - name: Create App Store Connect auth key
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        env:
          AUTHKEY_P8: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_95 }}
        run: scripts/makeauthkey.sh

      - name: Ship to Apple App Store
        if: steps.existing.outputs.exists != 'true'
        uses: ./.github/workflows/actions/ship-to-apple-store
        with:
          app_store_connect_issuer_id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          app_store_connect_key_identifier: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER_95 }}
          ipa_path: ${{ runner.temp }}/artifact/BCWallet.ipa

  google-upload:
    name: 'Google Play internal - ${{ matrix.variant }}'
    needs: resolve-build
    if: >-
      (inputs.targets == 'all' || inputs.targets == 'google-store') &&
      needs.resolve-build.outputs.aab_variants != '[]'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.resolve-build.outputs.aab_variants) }}
    steps:
      - name: Download AAB
        uses: actions/download-artifact@v8
        with:
          name: android-${{ matrix.variant }}.aab
          path: ${{ runner.temp }}/artifact
          run-id: ${{ needs.resolve-build.outputs.run_id }}
          github-token: ${{ github.token }}

      - uses: actions/checkout@v7

      - name: Use the build's variant config
        uses: ./.github/workflows/actions/use-build-variant-config
        with:
          head_sha: ${{ needs.resolve-build.outputs.head_sha }}

      - name: Load variant config
        uses: ./.github/workflows/actions/load-variant-config
        with:
          variant: ${{ matrix.variant }}

      # bundletool validates the AAB before upload, and it needs a JRE.
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0

      - name: Fetch Google Play publisher credentials
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          # `op read` to stdout appends a trailing newline, which would corrupt
          # this JSON credentials file. --out-file writes the bytes as-is.
          op read "op://bcsc-mobile-app-cd/google-play-publisher/service-account.json" --out-file "${RUNNER_TEMP}/play-service-account.json" --force

      - name: Ship to Google Play
        uses: ./.github/workflows/actions/ship-to-google-store
        with:
          service_account_file: ${{ runner.temp }}/play-service-account.json
          package_name: ${{ env.ANDROID_PACKAGE_NAME }}
          version_code: ${{ needs.resolve-build.outputs.run_number }}
          version_name: ${{ env.APP_VERSION }}
          build_number: ${{ needs.resolve-build.outputs.run_number }}
          bundle_path: ${{ runner.temp }}/artifact/app-release.aab
          track: internal

  firebase-ios:
    name: 'Firebase iOS ring-0 - ${{ matrix.variant }}'
    needs: resolve-build
    if: >-
      (inputs.targets == 'all' || inputs.targets == 'firebase') &&
      needs.resolve-build.outputs.ipa_variants != '[]'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.resolve-build.outputs.ipa_variants) }}
    steps:
      - name: Download IPA
        uses: actions/download-artifact@v8
        with:
          name: ios-${{ matrix.variant }}.ipa
          path: ${{ runner.temp }}/firebase-artifact
          run-id: ${{ needs.resolve-build.outputs.run_id }}
          github-token: ${{ github.token }}

      - uses: actions/checkout@v7

      - name: Use the build's variant config
        uses: ./.github/workflows/actions/use-build-variant-config
        with:
          head_sha: ${{ needs.resolve-build.outputs.head_sha }}

      - name: Load variant config
        uses: ./.github/workflows/actions/load-variant-config
        with:
          variant: ${{ matrix.variant }}

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0

      - name: Fetch Firebase credentials
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          # `op read` to stdout appends a trailing newline; --out-file writes
          # the document byte-for-byte instead.
          op read "op://bcsc-mobile-app-cd/google-services-ios-${{ matrix.variant }}/GoogleService-Info.plist" --out-file "${RUNNER_TEMP}/google-services-source" --force
          op read "${FIREBASE_IOS_SA_REF}" --out-file "${RUNNER_TEMP}/firebase-service-account.json" --force

      - name: Distribute to Firebase App Distribution
        uses: ./.github/workflows/actions/distribute-firebase
        with:
          platform: ios
          app_identifier: ${{ env.IOS_BUNDLE_ID }}
          google_services_file: ${{ runner.temp }}/google-services-source
          service_account_file: ${{ runner.temp }}/firebase-service-account.json
          artifact_path: ${{ runner.temp }}/firebase-artifact/BCWallet.ipa
          groups: ring-0
          version_name: ${{ env.APP_VERSION }}
          version_code: ${{ needs.resolve-build.outputs.run_number }}

  firebase-android:
    name: 'Firebase Android ring-0 - ${{ matrix.variant }}'
    needs: resolve-build
    if: >-
      (inputs.targets == 'all' || inputs.targets == 'firebase') &&
      needs.resolve-build.outputs.apk_variants != '[]'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.resolve-build.outputs.apk_variants) }}
    steps:
      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: android-${{ matrix.variant }}.apk
          path: ${{ runner.temp }}/firebase-artifact
          run-id: ${{ needs.resolve-build.outputs.run_id }}
          github-token: ${{ github.token }}

      - uses: actions/checkout@v7

      - name: Use the build's variant config
        uses: ./.github/workflows/actions/use-build-variant-config
        with:
          head_sha: ${{ needs.resolve-build.outputs.head_sha }}

      - name: Load variant config
        uses: ./.github/workflows/actions/load-variant-config
        with:
          variant: ${{ matrix.variant }}

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0

      - name: Fetch Firebase credentials
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          # `op read` to stdout appends a trailing newline; --out-file writes
          # the document byte-for-byte instead.
          op read "op://bcsc-mobile-app-cd/google-services-android-${{ matrix.variant }}/google-services.json" --out-file "${RUNNER_TEMP}/google-services-source" --force
          op read "${FIREBASE_ANDROID_SA_REF}" --out-file "${RUNNER_TEMP}/firebase-service-account.json" --force

      - name: Distribute to Firebase App Distribution
        uses: ./.github/workflows/actions/distribute-firebase
        with:
          platform: android
          app_identifier: ${{ env.ANDROID_PACKAGE_NAME }}
          google_services_file: ${{ runner.temp }}/google-services-source
          service_account_file: ${{ runner.temp }}/firebase-service-account.json
          artifact_path: ${{ runner.temp }}/firebase-artifact/app-release.apk
          groups: ring-0
          version_name: ${{ env.APP_VERSION }}
          version_code: ${{ needs.resolve-build.outputs.run_number }}

  # ─── Tag the ring-0 build ──────────────────────────────────────────
  # Once a build reaches ring-0 (uploaded to stores, firebase etc.), tag
  # the commit with bcsc-v<APP_VERSION>-<build number>.
  # APP_VERSION comes from that commit's variant.env, not from main.
  # Idempotent: a single-store retry re-runs this and finds the tag already there
  tag-ring-0:
    name: Tag ring-0 build
    needs: [resolve-build, apple-upload, google-upload, firebase-ios, firebase-android]
    if: >-
      always() && !cancelled() &&
      needs.resolve-build.result == 'success' &&
      needs.apple-upload.result != 'failure' &&
      needs.google-upload.result != 'failure' &&
      needs.firebase-ios.result != 'failure' &&
      needs.firebase-android.result != 'failure'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-build.outputs.head_sha }}

      - name: Load bcsc-prod variant config
        uses: ./.github/workflows/actions/load-variant-config
        with:
          variant: bcsc-prod

      - name: Create and push the tag
        env:
          BUILD_NUMBER: ${{ needs.resolve-build.outputs.run_number }}
          HEAD_SHA: ${{ needs.resolve-build.outputs.head_sha }}
        run: |
          set -euo pipefail
          TAG="bcsc-v${APP_VERSION}-${BUILD_NUMBER}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists — nothing to do."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" "${HEAD_SHA}" -m "Published build ${BUILD_NUMBER} to ring-0"
          git push origin "refs/tags/${TAG}"
          echo "Tagged ${HEAD_SHA} as ${TAG}"

  # ─── The approval gates ──────────────────────────────────────────────
  # Each gate is its own environment, so who approves ring-4 is configured
  # separately from who approves ring-1. approve-ring-1 waits on the ring-0
  # jobs so the prompt appears once the team has the build; a failed ring-0
  # leg does not block it, because each widen job fails on its own if its
  # variant's build never made it out: TestFlight bails NOT_FOUND after
  # 180s, `tracks set-release` errors on a version code that was never
  # uploaded, and Firebase widen re-distributes its own artifact. Later
  # gates wait on the previous ring's widening the same way, and
  # deliberately not on its result. An environment with no protection rules
  # approves instantly, so a gate is open until required reviewers are
  # configured in Settings.

  approve-ring-1:
    name: Approve ring-1
    needs: [resolve-build, apple-upload, google-upload, firebase-ios, firebase-android]
    # resolve-build success is tested first: fromJSON must not see an empty output.
    # Skipping this gate skips the whole chain, since each one needs the last.
    if: >-
      always() && !cancelled() &&
      needs.resolve-build.result == 'success' &&
      needs.resolve-build.outputs.has_widening == 'true' &&
      contains(fromJSON(needs.resolve-build.outputs.reached_rings), 'ring-1')
    runs-on: ubuntu-22.04
    environment:
      name: ring-1
    permissions: {}
    steps:
      - name: Approved
        env:
          BUILD: ${{ needs.resolve-build.outputs.run_number }}
        run: echo "Build ${BUILD} approved for ring-1"

  ring-1:
    needs: [resolve-build, approve-ring-1]
    if: >-
      needs.approve-ring-1.result == 'success' &&
      contains(fromJSON(needs.resolve-build.outputs.reached_rings), 'ring-1')
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/publish-ring.yml
    with:
      ring: ring-1
      run_id: ${{ needs.resolve-build.outputs.run_id }}
      run_number: ${{ needs.resolve-build.outputs.run_number }}
      head_sha: ${{ needs.resolve-build.outputs.head_sha }}
      widen_ipa_variants: ${{ needs.resolve-build.outputs.widen_ipa_variants }}
      widen_aab_variants: ${{ needs.resolve-build.outputs.widen_aab_variants }}
      widen_apk_variants: ${{ needs.resolve-build.outputs.widen_apk_variants }}
      targets: ${{ inputs.targets }}
    secrets: inherit

  approve-ring-2:
    name: Approve ring-2
    needs: [resolve-build, approve-ring-1, ring-1]
    if: >-
      always() && !cancelled() &&
      needs.approve-ring-1.result == 'success' &&
      contains(fromJSON(needs.resolve-build.outputs.reached_rings), 'ring-2')
    runs-on: ubuntu-22.04
    environment:
      name: ring-2
    permissions: {}
    steps:
      - name: Approved
        env:
          BUILD: ${{ needs.resolve-build.outputs.run_number }}
        run: echo "Build ${BUILD} approved for ring-2"

  ring-2:
    needs: [resolve-build, approve-ring-2]
    if: >-
      needs.approve-ring-2.result == 'success' &&
      contains(fromJSON(needs.resolve-build.outputs.reached_rings), 'ring-2')
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/publish-ring.yml
    with:
      ring: ring-2
      run_id: ${{ needs.resolve-build.outputs.run_id }}
      run_number: ${{ needs.resolve-build.outputs.run_number }}
      head_sha: ${{ needs.resolve-build.outputs.head_sha }}
      widen_ipa_variants: ${{ needs.resolve-build.outputs.widen_ipa_variants }}
      widen_aab_variants: ${{ needs.resolve-build.outputs.widen_aab_variants }}
      widen_apk_variants: ${{ needs.resolve-build.outputs.widen_apk_variants }}
      targets: ${{ inputs.targets }}
    secrets: inherit

  approve-ring-3:
    name: Approve ring-3
    needs: [resolve-build, approve-ring-2, ring-2]
    if: >-
      always() && !cancelled() &&
      needs.approve-ring-2.result == 'success' &&
      contains(fromJSON(needs.resolve-build.outputs.reached_rings), 'ring-3')
    runs-on: ubuntu-22.04
    environment:
      name: ring-3
    permissions: {}
    steps:
      - name: Approved
        env:
          BUILD: ${{ needs.resolve-build.outputs.run_number }}
        run: echo "Build ${BUILD} approved for ring-3"

  ring-3:
    needs: [resolve-build, approve-ring-3]
    if: >-
      needs.approve-ring-3.result == 'success' &&
      contains(fromJSON(needs.resolve-build.outputs.reached_rings), 'ring-3')
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/publish-ring.yml
    with:
      ring: ring-3
      run_id: ${{ needs.resolve-build.outputs.run_id }}
      run_number: ${{ needs.resolve-build.outputs.run_number }}
      head_sha: ${{ needs.resolve-build.outputs.head_sha }}
      widen_ipa_variants: ${{ needs.resolve-build.outputs.widen_ipa_variants }}
      widen_aab_variants: ${{ needs.resolve-build.outputs.widen_aab_variants }}
      widen_apk_variants: ${{ needs.resolve-build.outputs.widen_apk_variants }}
      targets: ${{ inputs.targets }}
    secrets: inherit

  approve-ring-4:
    name: Approve ring-4
    needs: [resolve-build, approve-ring-3, ring-3]
    if: >-
      always() && !cancelled() &&
      needs.approve-ring-3.result == 'success' &&
      contains(fromJSON(needs.resolve-build.outputs.reached_rings), 'ring-4')
    runs-on: ubuntu-22.04
    environment:
      name: ring-4
    permissions: {}
    steps:
      - name: Approved
        env:
          BUILD: ${{ needs.resolve-build.outputs.run_number }}
        run: echo "Build ${BUILD} approved for ring-4"

  ring-4:
    needs: [resolve-build, approve-ring-4]
    if: >-
      needs.approve-ring-4.result == 'success' &&
      contains(fromJSON(needs.resolve-build.outputs.reached_rings), 'ring-4')
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/publish-ring.yml
    with:
      ring: ring-4
      run_id: ${{ needs.resolve-build.outputs.run_id }}
      run_number: ${{ needs.resolve-build.outputs.run_number }}
      head_sha: ${{ needs.resolve-build.outputs.head_sha }}
      widen_ipa_variants: ${{ needs.resolve-build.outputs.widen_ipa_variants }}
      widen_aab_variants: ${{ needs.resolve-build.outputs.widen_aab_variants }}
      widen_apk_variants: ${{ needs.resolve-build.outputs.widen_apk_variants }}
      targets: ${{ inputs.targets }}
    secrets: inherit
