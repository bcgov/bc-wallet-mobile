# Drain send-video queue
#
# The send-video e2e journeys upload real verification requests to the SIT IDcheck agent queue and
# review them by script. The queue has no worklist — a review claims the NEXT request blindly — so
# anything a failed journey leaves behind is what the next run claims, or what the UAT team cleans
# by hand in the morning. This workflow rejects whatever is queued, with the reason
# "Automated e2e queue cleanup", and lists what it rejected in the run summary.
#
#   workflow_call     — after every e2e.yml suite that ran the send-video journeys, and once more at
#                       the end of the nightly (e2e-nightly.yml)
#   workflow_dispatch — on demand from the Actions tab: scope `all` (everything queued) or `e2e`
#                       (only the e2e personas; stops at the first foreign request); `dry_run` only
#                       signs in and reports which queues hold work — the cheap sign-in check from
#                       the runner's own egress IP
#
# The drain talks to idsit.gov.bc.ca from the RUNNER (e2e/scripts/login.mjs), so it needs the
# allowlisted `ubuntu-latest-m` runner and the IDCheck test account from 1Password — the same
# constraints as the in-person approval step in e2e.yml.
name: Drain send-video queue

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      scope:
        description: 'all (everything queued) or e2e (only the e2e personas)'
        type: string
        required: false
        default: all
      max_claims:
        description: 'Stop after this many claims'
        type: number
        required: false
        default: 25
      runner_label:
        description: 'Label of the large runner with whitelisted egress IPs'
        type: string
        required: false
        default: 'ubuntu-latest-m'
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN:
        required: true
        description: '1Password service account token; the IDCHECK_* sign-in comes from the bcsc-mobile-app-cd vault'
  workflow_dispatch:
    inputs:
      scope:
        description: 'What to reject: everything queued, or only the e2e personas'
        type: choice
        options:
          - all
          - e2e
        default: all
      max_claims:
        description: 'Stop after this many claims'
        type: number
        default: 25
      dry_run:
        description: 'Only sign in and report which queues hold work (claims nothing)'
        type: boolean
        default: false
      auth_reset:
        description: 'Clear a stuck Entra sign-in latch before running (use after fixing the cause)'
        type: boolean
        default: false
      runner_label:
        description: 'Label of the large runner with whitelisted egress IPs'
        type: string
        default: 'ubuntu-latest-m'

jobs:
  drain:
    name: 'drain send-video queue (${{ inputs.scope }})'
    runs-on: ${{ inputs.runner_label }}
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup E2E
        uses: ./.github/workflows/actions/setup-e2e
        with:
          idcheck-browser: 'true'

      # Outputs (not export-env) keep the credentials scoped to the one step that uses them.
      - name: Load IDCheck secrets from 1Password
        id: op_idcheck
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          # email = the account's Entra sign-in name (UPN); otp-seed = its authenticator base32 secret
          IDCHECK_USER: op://bcsc-mobile-app-cd/bcsc-ias-test-account/email
          IDCHECK_PASSWORD: op://bcsc-mobile-app-cd/bcsc-ias-test-account/credential
          IDCHECK_TOTP_SECRET: op://bcsc-mobile-app-cd/bcsc-ias-test-account/password

      - name: Drain the queue
        working-directory: e2e
        env:
          IDCHECK_USER: ${{ steps.op_idcheck.outputs.IDCHECK_USER }}
          IDCHECK_PASSWORD: ${{ steps.op_idcheck.outputs.IDCHECK_PASSWORD }}
          IDCHECK_TOTP_SECRET: ${{ steps.op_idcheck.outputs.IDCHECK_TOTP_SECRET }}
          IDCHECK_STATE_DIR: ${{ runner.temp }}/idcheck-e2e # per-job, writable; see idcheck-session.mjs
          IDCHECK_AUTH_RESET: ${{ inputs.auth_reset == true && '1' || '' }} # clear a sign-in latch on demand
          SCOPE: ${{ inputs.scope }} # via env, never inline in run — inputs are attacker-controlled
          MAX_CLAIMS: ${{ inputs.max_claims }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }} # boolean → flag; empty when called from e2e.yml
        run: |
          # tsx binary directly — yarn's own stdout banners would garble the summary
          ./node_modules/.bin/tsx scripts/send-video-queue.ts drain --scope "$SCOPE" --max "${MAX_CLAIMS:-25}" ${DRY_RUN:+--dry-run}

      # A failed sign-in leaves its screenshot here (e2e/reports/, gitignored).
      - name: Upload sign-in screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: send-video-queue-screenshots-${{ github.run_attempt }}
          path: e2e/reports/screenshots/
          if-no-files-found: ignore
          overwrite: true # the workflow is called several times per nightly run
