name: Native Build & Test

env:
  APP_BUILD_NUMBER: ${{ github.run_number }}

on:
  workflow_dispatch:
  push:
    branches: [main, 'release/**']
    paths:
      - app/**
      - .yarn/**
      - variants/**
      - scripts/**
      - .github/workflows/**
  pull_request:
    branches: [main, 'release/**']
  merge_group:

jobs:
  check-secrets:
    # Fork PRs never have access to repo/org secrets (including
    # OP_SERVICE_ACCOUNT_TOKEN), so this job would otherwise always fail
    # for external contributors. Downstream jobs (build-ios, build-android)
    # already implicitly require this job to succeed via `needs:`, and
    # today already skip entirely on fork PRs because this job fails —
    # skipping it cleanly here reports that as "skipped" instead of a
    # confusing red "failed" check, without changing that downstream
    # outcome (a skipped `needs:` job still fails the default success()
    # gate on build-ios/build-android, same as a failed one did).
    if: github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-22.04
    permissions: {}
    steps:
      - name: Check secrets
        shell: bash
        run: |
          required_env_vars=(
            "CERTIFICATE"
            "KEYCHIAN_PASSWD"
            "OP_SERVICE_ACCOUNT_TOKEN"
          )
          for var in "${required_env_vars[@]}"; do
            if [ -z "${!var}" ]; then
              echo "error: $var is not set."
              exit 1
            fi
          done
        env:
          CERTIFICATE: ${{ secrets.APPLE_APP_STORE_BUILD_CERTIFICATE_BASE64 }}
          KEYCHIAN_PASSWD: ${{ secrets.APPLE_APP_STORE_BUILD_CERTIFICATE_PASSWD }}
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
  check-vars:
    runs-on: ubuntu-22.04
    permissions: {}
    steps:
      - name: Check variables
        shell: bash
        run: |
          required_env_vars=(
            "OCA_URL"
            "PROOF_TEMPLATE_URL"
            "MEDIATOR_USE_PUSH_NOTIFICATIONS"
            "INDY_VDR_PROXY_URL"
            "SNOWPLOW_COLLECTOR_URL"
          )
          for var in "${required_env_vars[@]}"; do
            if [ -z "${!var}" ]; then
              echo "error: $var is not set."
              exit 1
            fi
          done
        env:
          OCA_URL: ${{ vars.OCA_URL }}
          PROOF_TEMPLATE_URL: ${{ vars.PROOF_TEMPLATE_URL }}
          MEDIATOR_USE_PUSH_NOTIFICATIONS: ${{ vars.MEDIATOR_USE_PUSH_NOTIFICATIONS }}
          INDY_VDR_PROXY_URL: ${{ vars.INDY_VDR_PROXY_URL }}
          SNOWPLOW_COLLECTOR_URL: ${{ vars.SNOWPLOW_COLLECTOR_URL }}

  # ─── Dynamic Variant Matrix ──────────────────────────────────────────
  # Determine variant matrix
  # - PRs / merge queue / release/v4.x branches: bcwallet-prod + bcsc-dev (fast feedback).
  # - Pushes / workflow_dispatch on main: all variants.
  compute-variants:
    runs-on: ubuntu-22.04
    outputs:
      variants: ${{ steps.set-variants.outputs.variants }}
    steps:
      - name: Determine variant matrix
        id: set-variants
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "merge_group" || "$REF_NAME" == release/v* ]]; then
            echo 'variants=["bcwallet-prod","bcsc-dev"]' >> "$GITHUB_OUTPUT"
          else
            echo 'variants=["bcwallet-prod","bcsc-dev","bcsc-qa","bcsc-test","bcsc-prod"]' >> "$GITHUB_OUTPUT"
          fi

  early-exit-check:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      should_skip_build: ${{ steps.core_files_changed.outputs.result == 'false' }}
    env:
      VALIDATED_VARIANTS: 'bcsc-dev bcsc-qa bcsc-test bcsc-prod'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all branches, main needed.

      - name: Validate APP_VERSION matches release branch
        shell: bash
        if: >-
          startsWith(github.ref_name, 'release/v') ||
          startsWith(github.base_ref, 'release/v')
        run: |
          set -euo pipefail
          # Resolve the release branch name regardless of trigger.
          # On push to release/*: github.ref_name is the branch name.
          # On PR into release/*: github.base_ref is the target branch.
          BRANCH="${GITHUB_BASE_REF:-${GITHUB_REF_NAME}}"
          echo "Release branch: ${BRANCH}"

          # Extract X.Y.Z from release/vX.Y.Z (allow optional suffix
          # like release/v4.1.0-rc.1; we only enforce the X.Y.Z prefix).
          if [[ ! "$BRANCH" =~ ^release/v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            echo "::error::Branch '${BRANCH}' does not match release/vX.Y.Z"
            exit 1
          fi
          EXPECTED_VERSION="${BASH_REMATCH[1]}"
          echo "Expected APP_VERSION: ${EXPECTED_VERSION}"

          fail=0
          for variant in $VALIDATED_VARIANTS; do
            file="variants/${variant}/variant.env"
            if [ ! -f "$file" ]; then
              echo "::error file=${file}::variant.env not found for ${variant}"
              fail=1
              continue
            fi
            # APP_VERSION='4.1.0' or APP_VERSION="4.1.0" or APP_VERSION=4.1.0
            actual=$(grep -E "^APP_VERSION=" "$file" | head -n1 | sed -E "s/^APP_VERSION=['\"]?([^'\"]+)['\"]?$/\\1/")
            if [ -z "$actual" ]; then
              echo "::error file=${file}::APP_VERSION not set"
              fail=1
              continue
            fi
            if [ "$actual" != "$EXPECTED_VERSION" ]; then
              echo "::error file=${file}::APP_VERSION='${actual}' does not match release branch version '${EXPECTED_VERSION}'"
              fail=1
            else
              echo "✅ ${variant}: APP_VERSION=${actual}"
            fi
          done

          if [ $fail -ne 0 ]; then
            exit 1
          fi

      - name: Check if core files changed
        id: core_files_changed
        shell: bash
        run: |
          set -x

          # If this workflow was manually triggered, always force a build.
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "Manual workflow_dispatch run detected; forcing build regardless of diff."
            echo "result=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Merge queue: skip all builds — only build-summary (required check) needs to pass.
          if [ "${GITHUB_EVENT_NAME}" = "merge_group" ]; then
            echo "Merge queue run detected; skipping builds."
            echo "result=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "${GITHUB_REF_NAME}" = "main" ] || [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            # On a branch push (main or release/*), compare with the
            # previous commit on that same branch.
            parent_ref="${GITHUB_SHA}^"
            child_ref="${GITHUB_SHA}"
          else
            # On PRs, compare with the base branch.
            parent_ref="origin/${GITHUB_BASE_REF:-main}"
            child_ref="HEAD"
          fi

          echo "Comparing ${parent_ref} with ${child_ref}"

          diff_output=$(git diff --name-only ${parent_ref}..${child_ref})
          change_count=$(echo "$diff_output" | (grep -E '^(app/.*)|(.yarn/.*)|(variants/.*)|(scripts/.*)|(patch/.*)|(.github/workflows/.*)' || true) | wc -l | awk '{$1=$1};1')

          echo "$change_count files changed in app, .yarn, or .github/workflows"

          if [ $change_count -gt 0 ]; then
            # A result greater than 0 means there are changes
            # in the specified directories.
            echo "result=true" >> $GITHUB_OUTPUT
          else
            echo "result=false" >> $GITHUB_OUTPUT
          fi

  # ─── Shared Preparation ─────────────────────────────────────────────
  # Builds the JS bundle once for all variants, saving ~2-3 min per
  # variant build.  The pre-built bundle is uploaded as an artifact and
  # downloaded by build-ios (SKIP_BUNDLING=1) and build-android
  # (SKIP_METRO_BUNDLE=1), so Metro is never invoked during native builds.
  prepare-ios:
    needs: [early-exit-check]
    if: needs.early-exit-check.outputs.should_skip_build != 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup NodeJS
        uses: ./.github/workflows/actions/setup-node

      - name: Cache Yarn dependencies and node_modules
        uses: actions/cache@v6
        with:
          path: |
            .yarn/cache
            node_modules
            app/node_modules
            packages/bcsc-core/node_modules
          key: yarn-deps-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-deps-${{ runner.os }}-
            yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
            yarn-${{ runner.os }}-

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            yarn install --immutable && break
            echo "⚠️ yarn install failed (attempt $attempt/3), retrying in 10s..."
            sleep 10
          done

      # ── Cache strategy: save on main only ────────────────────────
      # With squash-merge to main, only main commits produce durable
      # cache entries. PR builds restore from main's latest cache but
      # never save, avoiding storage waste from short-lived PR branches.
      - name: Restore Metro bundler cache
        uses: actions/cache/restore@v6
        with:
          path: app/.metro-cache
          key: metro-ios-${{ hashFiles('yarn.lock', 'app/metro.config.js') }}
          restore-keys: metro-ios-

      - name: Build iOS JS bundle
        working-directory: app
        run: |
          npx react-native bundle \
            --platform ios \
            --dev false \
            --entry-file index.js \
            --bundle-output /tmp/ios-main.jsbundle \
            --assets-dest /tmp/ios-assets \
            --verbose

      - name: Upload iOS JS bundle
        uses: actions/upload-artifact@v7
        with:
          name: ios-jsbundle
          path: /tmp/ios-main.jsbundle
          retention-days: 1

      - name: Upload iOS JS assets
        uses: actions/upload-artifact@v7
        with:
          name: ios-jsassets
          path: /tmp/ios-assets
          retention-days: 1
          if-no-files-found: warn

      - name: Save Metro bundler cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: app/.metro-cache
          key: metro-ios-${{ hashFiles('yarn.lock', 'app/metro.config.js') }}

  # ─── Android Prepare: JS Bundle + Gradle Build-Cache Warm-Up ──────────
  # 1. Runs Metro to produce the Android JS bundle and image assets,
  #    then uploads them as artifacts for the variant build jobs.
  # 2. Runs a release build (minus JS bundling) using the committed debug
  #    keystore.  The Gradle build cache captures task outputs that are
  #    identical across all variants: CMake/NDK native compilation (4 ABIs),
  #    Kotlin & Java compilation of library modules, and resource processing.
  #    Variant builds then restore this cache and only rebuild the delta
  #    (package name, app icons, strings, signing, final packaging).
  #
  # Build cache lives at the default $GRADLE_USER_HOME/caches/build-cache-1
  # and is saved/restored with a dedicated cache action for cross-run reuse.
  #
  # Runs in parallel with `prepare-ios` and `build-ios`, so it does NOT
  # extend the iOS critical path.
  prepare-android:
    needs: [early-exit-check]
    if: needs.early-exit-check.outputs.should_skip_build != 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      GRADLE_USER_HOME: /mnt/gradle-cache
    steps:
      - uses: actions/checkout@v7

      - name: Prepare directories
        run: |
          sudo mkdir -p /mnt/gradle-cache
          sudo chown -R $USER:$USER /mnt/gradle-cache

      - name: Setup NodeJS
        uses: ./.github/workflows/actions/setup-node

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Restore Gradle dependencies
        uses: actions/cache@v6
        with:
          path: |
            /mnt/gradle-cache/caches
            /mnt/gradle-cache/wrapper
            !/mnt/gradle-cache/caches/build-cache-1
          key: gradle-deps-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle*', 'app/android/**/*.lockfile', 'app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-deps-${{ runner.os }}-

      - name: Cache Yarn dependencies and node_modules
        uses: actions/cache@v6
        with:
          path: |
            .yarn/cache
            node_modules
            app/node_modules
            packages/bcsc-core/node_modules
          key: yarn-deps-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-deps-${{ runner.os }}-
            yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
            yarn-${{ runner.os }}-

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            yarn install --immutable && break
            echo "⚠️ yarn install failed (attempt $attempt/3), retrying in 10s..."
            sleep 10
          done

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL \
            /opt/microsoft /opt/google /opt/az /usr/local/julia*
          sudo docker image prune --all --force 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true

      - name: Restore Metro bundler cache
        uses: actions/cache/restore@v6
        with:
          path: app/.metro-cache
          key: metro-android-${{ hashFiles('yarn.lock', 'app/metro.config.js') }}
          restore-keys: metro-android-

      - name: Build Android JS bundle
        working-directory: app
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res \
            --verbose

      - name: Upload Android JS bundle
        uses: actions/upload-artifact@v7
        with:
          name: android-jsbundle
          path: app/android/app/src/main/assets/index.android.bundle
          retention-days: 1

      - name: Upload Android JS assets
        uses: actions/upload-artifact@v7
        with:
          name: android-jsassets
          path: app/android/app/src/main/res/drawable-*
          retention-days: 1
          if-no-files-found: warn

      - name: Save Metro bundler cache (Android)
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: app/.metro-cache
          key: metro-android-${{ hashFiles('yarn.lock', 'app/metro.config.js') }}

      - name: Restore Gradle build cache (cross-run)
        uses: actions/cache/restore@v6
        with:
          path: /mnt/gradle-cache/caches/build-cache-1
          key: gradle-build-cache-${{ hashFiles('app/android/**/*.gradle*', 'app/android/gradle/wrapper/gradle-wrapper.properties', 'yarn.lock') }}
          restore-keys: gradle-build-cache-

      - name: Warm Gradle build cache
        working-directory: app/android
        continue-on-error: true
        run: |
          # Build all library subprojects only (skip the :app: module).
          # The library projects contain all the expensive cacheable work:
          # - CMake/NDK compilation for 5 native modules (anoncreds, indy-vdr,
          #   askar, reanimated, screens, vision-camera) × 2 ABIs
          # - Kotlin/Java compilation for 30+ React Native library modules
          #
          # The :app: module is excluded because:
          # 1. It requires google-services.json (variant-specific secret)
          # 2. Its createBundleReleaseJsAndAssets task cannot be skipped
          #    (Gradle 8 lazy providers fail when querying skipped task outputs)
          # 3. Its tasks are fast (~17s) and partly variant-specific anyway
          ./gradlew assembleRelease \
            --build-cache \
            --parallel \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a \
            -x lintVitalRelease \
            -x :app:assembleRelease

      - name: Inspect build cache
        if: always()
        run: |
          echo "=== Build cache ==="
          du -sh "$GRADLE_USER_HOME/caches/build-cache-1" 2>/dev/null || echo "Build cache dir not found"
          ls -la "$GRADLE_USER_HOME/caches/build-cache-1/" 2>/dev/null | head -20 || true
          find "$GRADLE_USER_HOME/caches/build-cache-1" -type f 2>/dev/null | wc -l | xargs -I{} echo "File count: {}"
          echo "=== Disk space ==="
          df -h

      - name: Save Gradle build cache
        if: github.ref == 'refs/heads/main' && always()
        uses: actions/cache/save@v6
        with:
          path: /mnt/gradle-cache/caches/build-cache-1
          key: gradle-build-cache-${{ hashFiles('app/android/**/*.gradle*', 'app/android/gradle/wrapper/gradle-wrapper.properties', 'yarn.lock') }}

  build-ios:
    name: Build iOS - ${{ matrix.variant }}
    needs: [check-secrets, check-vars, early-exit-check, prepare-ios, compute-variants]
    if: needs.early-exit-check.outputs.should_skip_build != 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.compute-variants.outputs.variants) }}
    env:
      REACT_NATIVE_NODE_BINARY: $(which node)
      NODE_BINARY: $(which node)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Load variant config
        uses: ./.github/workflows/actions/load-variant-config
        with:
          variant: ${{ matrix.variant }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Setup NodeJS
        uses: ./.github/workflows/actions/setup-node

      - name: Configure ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: ./app

      - name: What XCode are we using?
        run: |
          find /Applications -type d -maxdepth 1 -iname 'xcode*.app'
          sudo xcode-select --switch /Applications/Xcode_26.2.app
          sudo xcode-select -p

      - name: Install ccache
        run: |
          # ccache is pre-installed on macOS runner images but may not be linked
          brew list ccache &>/dev/null && brew link --overwrite ccache 2>/dev/null || brew install ccache
          ccache --version
          # Configure ccache: 2GB max, no compression (faster), sloppiness for Xcode
          ccache --set-config=max_size=2G
          ccache --set-config=compression=false
          ccache --set-config=sloppiness=clang_index_store,file_stat_matches,include_file_ctime,include_file_mtime,ivfsoverlay,pch_defines,modules,system_headers,time_macros
          ccache --set-config=depend_mode=true
          ccache --set-config=file_clone=true
          ccache --set-config=inode_cache=true

      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v6
        with:
          path: ~/Library/Caches/ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: ${{ runner.os }}-ccache-

      - name: Cached pip dependencies
        uses: actions/cache@v6
        id: pip-cache
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache pod dependencies
        id: pod-cache
        uses: actions/cache@v6
        with:
          path: |
            app/ios/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock', '**/firebase.json') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      # Derived data cache removed — xcodebuild recompiles all 1436 C/C++
      # files regardless of cached derived data (file timestamps and build
      # descriptions are invalidated by cache extraction and version bumps).
      # ccache provides the actual compilation reuse instead.

      - name: Cache Yarn dependencies and node_modules
        uses: actions/cache@v6
        with:
          path: |
            .yarn/cache
            node_modules
            app/node_modules
            packages/bcsc-core/node_modules
          key: yarn-deps-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-deps-${{ runner.os }}-
            yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
            yarn-${{ runner.os }}-

      - name: Install dependencies
        working-directory: ./
        run: |
          for attempt in 1 2 3; do
            yarn install --immutable && break
            echo "⚠️ yarn install failed (attempt $attempt/3), retrying in 10s..."
            sleep 10
          done
          git status

      - name: Create .xcode.env.local file
        working-directory: app/ios
        run: |
          echo "export NODE_BINARY=$(which node)" > .xcode.env.local
          echo "export PATH=\"$(dirname $(which node)):\$PATH\"" >> .xcode.env.local

      - name: Install iOS dependencies
        # if: steps.pod-cache.outputs.cache-hit != 'true' || steps.npm-cache.outputs.cache-hit != 'true'
        working-directory: app
        run: |
          export USE_HERMES=1
          yarn run ios:setup && \
          git status && \
          git diff ios/Podfile.lock

      # Metro cache restore removed — SKIP_BUNDLING=1 uses pre-built JS bundle,
      # so Metro is never invoked during the Xcode archive build.

      - name: Download pre-built iOS JS bundle
        uses: actions/download-artifact@v8
        with:
          name: ios-jsbundle
          path: app/ios/jsbundle

      - name: Download pre-built iOS JS assets
        uses: actions/download-artifact@v8
        with:
          name: ios-jsassets
          path: app/ios/jsassets

      - name: Apply variant configuration
        run: node scripts/apply-variant.mjs ${{ matrix.variant }}

      - name: Bump Build No.
        working-directory: app/ios
        env:
          CURRENT_PROJECT_VERSION: ${{ env.APP_BUILD_NUMBER }}
          MARKETING_VERSION: ${{ env.APP_VERSION }}
        run: |
          agvtool new-version ${CURRENT_PROJECT_VERSION} && \
          agvtool new-marketing-version ${MARKETING_VERSION}

      # Secrets are being consolidated into the bcsc-mobile-app-cd 1Password vault;
      # OP_SERVICE_ACCOUNT_TOKEN is the single bootstrap secret that stays in GitHub.
      # This step is fork-guarded because fork PRs cannot read that secret; when
      # skipped, both outputs are empty, so .env gets the same empty values on
      # forks as it did before these moved to 1Password.
      - name: Load .env secrets from 1Password
        id: op_remote_logging
        if: github.event.pull_request.head.repo.fork != true
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          # Only PROD variants get the production endpoints; SIT/QA/TEST all
          # share the test stack. An unset DEFAULT_ENVIRONMENT falls to test,
          # so a misconfigured variant can never reach production.
          REMOTE_LOGGING_URL: op://bcsc-mobile-app-cd/remote-logging-url/${{ env.DEFAULT_ENVIRONMENT == 'PROD' && 'prod' || 'test' }}
          MEDIATOR_URL: op://bcsc-mobile-app-cd/mediator-url/${{ env.DEFAULT_ENVIRONMENT == 'PROD' && 'prod' || 'test' }}

        # Actual environment variables are not being picked up
        # by the build so they're put into an .env file.
      - name: Create environment settings
        uses: ./.github/workflows/actions/create-environment-settings
        with:
          build_target: ${{ env.BUILD_TARGET }}
          mediator_use_push_notifications: ${{ vars.MEDIATOR_USE_PUSH_NOTIFICATIONS }}
          mediator_url: ${{ steps.op_remote_logging.outputs.MEDIATOR_URL }}
          oca_url: ${{ vars.OCA_URL }}
          proof_template_url: ${{ vars.PROOF_TEMPLATE_URL }}
          ledger_auto_update: ${{ vars.LEDGER_AUTO_UPDATE }}
          remote_logging_url: ${{ steps.op_remote_logging.outputs.REMOTE_LOGGING_URL }}
          indy_vdr_proxy_url: ${{ vars.INDY_VDR_PROXY_URL }}
          snowplow_collector_url: ${{ vars.SNOWPLOW_COLLECTOR_URL }}
          default_environment: ${{ env.DEFAULT_ENVIRONMENT }}

      # Secrets are being consolidated into the bcsc-mobile-app-cd 1Password vault;
      # OP_SERVICE_ACCOUNT_TOKEN is the single bootstrap secret that stays in GitHub.
      # These steps are fork-guarded because fork PRs cannot read that secret.
      - name: Install 1Password CLI
        if: github.event.pull_request.head.repo.fork != true
        uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0

      - name: Fetch Google Services config
        if: github.event.pull_request.head.repo.fork != true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          # `op read` to stdout appends a trailing newline; --out-file writes
          # the document byte-for-byte instead.
          op read "op://bcsc-mobile-app-cd/google-services-ios-${{ matrix.variant }}/GoogleService-Info.plist" --out-file app/ios/GoogleService-Info.plist --force

      - name: Update APS environment
        run: |
          plutil -replace aps-environment -string production app/ios/BCWallet/BCWallet.entitlements
          plutil -p app/ios/BCWallet/BCWallet.entitlements

      - name: Fetch iOS provisioning profile
        if: github.event.pull_request.head.repo.fork != true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          # `op read` to stdout appends a trailing newline, which would corrupt
          # this binary provisioning profile. --out-file writes the bytes as-is.
          op read "op://bcsc-mobile-app-cd/ios-provisioning-${{ matrix.variant }}/${{ matrix.variant }}.mobileprovision" --out-file "${{ matrix.variant }}.mobileprovision" --force

      - name: Create prod signing credentials
        # This step will not work in a `fork` because it will not have access
        # to org and repo secrets.
        if: github.event.pull_request.head.repo.fork != true
        uses: ./.github/workflows/actions/create-ios-sig-creds
        with:
          certificate: ${{ secrets.APPLE_APP_STORE_BUILD_CERTIFICATE_BASE64 }}
          certificate_password: ${{ secrets.APPLE_APP_STORE_BUILD_CERTIFICATE_PASSWD }}
          app_store_connect_private_key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_95 }}
          provisioning_profile_file: ${{ matrix.variant }}.mobileprovision

      - name: Generate iOS signing config
        # This step will not work in a `fork` because it will not have access
        # to org and repo secrets.
        if: github.event.pull_request.head.repo.fork != true
        env:
          PROVISIONING_PROFILE_FILE: ${{ matrix.variant }}.mobileprovision
        run: |
          # Extract the UUID from the provisioning profile
          PP_UUID=$(/usr/libexec/plistbuddy -c Print:UUID /dev/stdin <<< \
            "$(security cms -D -i "${PROVISIONING_PROFILE_FILE}")")
          echo "Provisioning profile UUID: ${PP_UUID}"

          cat > export-options.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>teamID</key>
            <string>L796QSLV3E</string>
            <key>method</key>
            <string>${{ env.IOS_EXPORT_METHOD }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${IOS_BUNDLE_ID}</key>
              <string>${PP_UUID}</string>
            </dict>
          </dict>
          </plist>
          EOF
          cat > release-variant.xcconfig <<XCEOF
          DEVELOPMENT_TEAM = L796QSLV3E
          CODE_SIGN_STYLE = Manual
          CODE_SIGN_IDENTITY = iPhone Distribution
          PROVISIONING_PROFILE_SPECIFIER = ${PP_UUID}
          CODE_SIGN_ENTITLEMENTS = \$(PROJECT_DIR)/BCWallet/BCWallet.entitlements
          XCEOF
          echo "Generated export-options.plist:"
          cat export-options.plist
          echo "Generated release-variant.xcconfig:"
          cat release-variant.xcconfig

      - name: Archive build
        if: github.event.pull_request.head.repo.fork != true
        working-directory: app/ios
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER_95 }}
          SKIP_BUNDLING: '1'
          FORCE_BUNDLING: ''
        run: |
          # Build optimizations:
          # - ccache via CC/CXX: cache C/C++/ObjC compilations across builds
          # - COMPILER_INDEX_STORE_ENABLE=NO: skip index-store writes (not needed in CI)
          # - parallelizeTargets: build independent targets in parallel
          xcodebuild \
          -workspace BCWallet.xcworkspace \
          -scheme BCWallet \
          -configuration Release \
          -xcconfig ../../release-variant.xcconfig \
          -derivedDataPath xbuild \
          -archivePath ../../BCWallet.xcarchive \
          -allowProvisioningUpdates \
          -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p9" \
          -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
          -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
          -sdk iphoneos \
          -parallelizeTargets \
          CC="$PWD/scripts/ccache-clang.sh" \
          CXX="$PWD/scripts/ccache-clang++.sh" \
          COMPILER_INDEX_STORE_ENABLE=NO \
          -verbose \
          archive

          # SKIP_BUNDLING=1 causes react-native-xcode.sh to exit immediately,
          # so no JS bundle or assets are placed in the .app. Copy them into
          # the archive's .app AFTER xcodebuild finishes so they are included
          # in the export/IPA.
          ARCHIVE_APP=$(find ../../BCWallet.xcarchive/Products/Applications -maxdepth 1 -name '*.app' -print -quit)
          echo "Archive .app path: $ARCHIVE_APP"
          cp jsbundle/ios-main.jsbundle "$ARCHIVE_APP/main.jsbundle"
          echo "Copied main.jsbundle into archive"
          # Copy pre-built image assets (PNG, JPEG, etc.) extracted by Metro
          # in the prepare-ios job. Without these, require('./image.png') resolves
          # to missing files at runtime.
          if [ -d jsassets/assets ]; then
            cp -R jsassets/assets "$ARCHIVE_APP/"
            echo "Copied $(find jsassets/assets -type f | wc -l | tr -d ' ') iOS asset files into archive"
          fi

      - name: Show ccache stats
        if: always()
        run: ccache --show-stats || true

      # Save from one variant only — native Pod compilations are identical
      # across all variants (1435/1436 CompileC targets are Pods; only the
      # app version file differs). Saving once avoids cache key conflicts
      # and halves storage usage.
      - name: Save ccache
        if: always() && matrix.variant == 'bcsc-dev' && steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/Library/Caches/ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('**/Podfile.lock') }}

      - name: Export production archive
        uses: ./.github/workflows/actions/export-ios-archive
        with:
          export_options: export-options.plist
          output_artifact_ref: ios-${{ matrix.variant }}

      - name: Ship to Apple App Store
        if: github.ref_name == 'main'
        uses: ./.github/workflows/actions/ship-to-itunes
        with:
          app_store_connect_issuer_id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          app_store_connect_key_identifier: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER_95 }}

  build-android:
    name: Build Android - ${{ matrix.variant }}
    needs: [check-secrets, check-vars, early-exit-check, prepare-android, compute-variants]
    if: |-
      needs.early-exit-check.outputs.should_skip_build != 'true' &&
      needs.prepare-android.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.compute-variants.outputs.variants) }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    env:
      GRADLE_USER_HOME: /mnt/gradle-cache
    steps:
      - uses: actions/checkout@v7

      - name: Prepare Gradle cache directory
        run: |
          sudo mkdir -p /mnt/gradle-cache
          sudo chown -R $USER:$USER /mnt/gradle-cache

      - name: Load variant config
        uses: ./.github/workflows/actions/load-variant-config
        with:
          variant: ${{ matrix.variant }}

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL \
            /opt/microsoft /opt/google /opt/az /usr/local/julia*
          sudo docker image prune --all --force 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Setup NodeJS
        uses: ./.github/workflows/actions/setup-node

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 17
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Restore Gradle dependencies
        uses: actions/cache@v6
        with:
          path: |
            /mnt/gradle-cache/caches
            /mnt/gradle-cache/wrapper
            !/mnt/gradle-cache/caches/build-cache-1
          key: gradle-deps-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle*', 'app/android/**/*.lockfile', 'app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-deps-${{ runner.os }}-

      - name: Cache Yarn dependencies and node_modules
        uses: actions/cache@v6
        with:
          path: |
            .yarn/cache
            node_modules
            app/node_modules
            packages/bcsc-core/node_modules
          key: yarn-deps-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-deps-${{ runner.os }}-
            yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
            yarn-${{ runner.os }}-

      - name: Install dependencies
        working-directory: ./
        run: |
          for attempt in 1 2 3; do
            yarn install --immutable && break
            echo "⚠️ yarn install failed (attempt $attempt/3), retrying in 10s..."
            sleep 10
          done
          git status

      - name: Restore Gradle build cache
        uses: actions/cache/restore@v6
        with:
          path: /mnt/gradle-cache/caches/build-cache-1
          key: gradle-build-cache-${{ hashFiles('app/android/**/*.gradle*', 'app/android/gradle/wrapper/gradle-wrapper.properties', 'yarn.lock') }}
          restore-keys: gradle-build-cache-

      - name: Inspect restored build cache
        run: |
          echo "=== Build cache after restore ==="
          du -sh "$GRADLE_USER_HOME/caches/build-cache-1" 2>/dev/null || echo "build-cache-1 dir not found"
          find "$GRADLE_USER_HOME/caches/build-cache-1" -type f 2>/dev/null | wc -l | xargs -I{} echo "File count: {}"

      # Metro cache restore is NOT needed here because SKIP_METRO_BUNDLE=1
      # uses copy-bundle.cjs instead of Metro. The Metro cache is only
      # used by the prepare-ios job.

      - name: Download pre-built JS bundle
        uses: actions/download-artifact@v8
        with:
          name: android-jsbundle
          path: app/android/app/src/main/assets

      - name: Download pre-built JS assets
        uses: actions/download-artifact@v8
        with:
          name: android-jsassets
          path: app/android/app/src/main/res

      - name: Apply variant configuration
        run: node scripts/apply-variant.mjs ${{ matrix.variant }}

      # Secrets are being consolidated into the bcsc-mobile-app-cd 1Password vault;
      # OP_SERVICE_ACCOUNT_TOKEN is the single bootstrap secret that stays in GitHub.
      # This step is fork-guarded because fork PRs cannot read that secret; when
      # skipped, both outputs are empty, so .env gets the same empty values on
      # forks as it did before these moved to 1Password.
      - name: Load .env secrets from 1Password
        id: op_remote_logging
        if: github.event.pull_request.head.repo.fork != true
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          # Only PROD variants get the production endpoints; SIT/QA/TEST all
          # share the test stack. An unset DEFAULT_ENVIRONMENT falls to test,
          # so a misconfigured variant can never reach production.
          REMOTE_LOGGING_URL: op://bcsc-mobile-app-cd/remote-logging-url/${{ env.DEFAULT_ENVIRONMENT == 'PROD' && 'prod' || 'test' }}
          MEDIATOR_URL: op://bcsc-mobile-app-cd/mediator-url/${{ env.DEFAULT_ENVIRONMENT == 'PROD' && 'prod' || 'test' }}

      # Actual environment variables are not being picked up
      # by the build so they're put into an .env file.
      - name: Create environment settings
        uses: ./.github/workflows/actions/create-environment-settings
        with:
          build_target: ${{ env.BUILD_TARGET }}
          mediator_use_push_notifications: ${{ vars.MEDIATOR_USE_PUSH_NOTIFICATIONS }}
          mediator_url: ${{ steps.op_remote_logging.outputs.MEDIATOR_URL }}
          oca_url: ${{ vars.OCA_URL }}
          proof_template_url: ${{ vars.PROOF_TEMPLATE_URL }}
          ledger_auto_update: ${{ vars.LEDGER_AUTO_UPDATE }}
          remote_logging_url: ${{ steps.op_remote_logging.outputs.REMOTE_LOGGING_URL }}
          indy_vdr_proxy_url: ${{ vars.INDY_VDR_PROXY_URL }}
          snowplow_collector_url: ${{ vars.SNOWPLOW_COLLECTOR_URL }}
          default_environment: ${{ env.DEFAULT_ENVIRONMENT }}

      # Secrets are being consolidated into the bcsc-mobile-app-cd 1Password vault;
      # OP_SERVICE_ACCOUNT_TOKEN is the single bootstrap secret that stays in GitHub.
      # These steps are fork-guarded because fork PRs cannot read that secret.
      - name: Install 1Password CLI
        if: github.event.pull_request.head.repo.fork != true
        uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0

      - name: Fetch Google Services config
        if: github.event.pull_request.head.repo.fork != true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          # `op read` to stdout appends a trailing newline; --out-file writes
          # the document byte-for-byte instead.
          op read "op://bcsc-mobile-app-cd/google-services-android-${{ matrix.variant }}/google-services.json" --out-file app/android/app/google-services.json --force

      # Outputs (not export-env) keep these two values scoped to only the
      # steps that reference them, matching the pre-migration scoping.
      - name: Load Android signing secrets from 1Password
        id: op_android_signing
        if: github.event.pull_request.head.repo.fork != true
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          PLAY_STORE_JKS_ALIAS: op://bcsc-mobile-app-cd/android-signing-${{ matrix.variant }}/key-alias
          PLAY_STORE_JKS_PASSWD: op://bcsc-mobile-app-cd/android-signing-${{ matrix.variant }}/store-password

      - name: Create release keystore
        # This step will not work in a `fork` because it will not have access
        # to org and repo secrets.
        if: github.event.pull_request.head.repo.fork != true
        working-directory: app/android/app
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          PLAY_STORE_JKS_ALIAS: ${{ steps.op_android_signing.outputs.PLAY_STORE_JKS_ALIAS }}
          PLAY_STORE_JKS_PASSWD: ${{ steps.op_android_signing.outputs.PLAY_STORE_JKS_PASSWD }}
        run: |
          # `op read` to stdout appends a trailing newline, which would corrupt
          # this binary keystore. --out-file writes the bytes as-is.
          op read "op://bcsc-mobile-app-cd/android-signing-${{ matrix.variant }}/release.keystore" --out-file release.keystore --force
          keytool -list -v -keystore release.keystore -alias "${PLAY_STORE_JKS_ALIAS}" -storepass:env PLAY_STORE_JKS_PASSWD | \
          grep "SHA1"

      - name: Android release build
        if: github.event.pull_request.head.repo.fork != true
        working-directory: app/android
        env:
          PLAY_STORE_JKS_ALIAS: ${{ steps.op_android_signing.outputs.PLAY_STORE_JKS_ALIAS }}
          PLAY_STORE_JKS_PASSWD: ${{ steps.op_android_signing.outputs.PLAY_STORE_JKS_PASSWD }}
          VERSION_CODE: ${{ env.APP_BUILD_NUMBER }}
          VERSION_NAME: ${{ env.APP_VERSION }}
          # Skip Metro bundling: use the pre-built JS bundle from the
          # prepare-android job instead of re-running Metro (~4 min savings).
          # Hermes bytecode compilation still runs on the copied bundle.
          SKIP_METRO_BUNDLE: '1'
        run: |
          # Optimizations applied:
          # 1. SKIP_METRO_BUNDLE=1: copies pre-built JS bundle instead of
          #    running Metro (~4 min savings). See scripts/copy-bundle.cjs.
          # 2. --parallel: builds independent library projects concurrently
          #    (30+ RN modules can compile/link in parallel)
          # 3. -PreactNativeArchitectures: limits CMake/NDK to release-only ABIs
          #    (arm64-v8a + armeabi-v7a only, skips x86/x86_64 emulator ABIs)
          # 4. -x lintVitalRelease: skip lint analysis (~1-2 min on critical path)
          #    Lint should run in a dedicated CI job, not block release builds.
          ./gradlew bundleRelease assembleRelease \
            --build-cache \
            --parallel \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a \
            -x lintVitalRelease

      # Gradle build cache is NOT saved here — prepare-android already
      # saves the comprehensive library cache. Variant builds only add
      # :app: module outputs (~17s of work) which aren't worth the ~1.5GB
      # cache entry per variant per run.

      - name: List Artifacts
        run: |
          find . -type f -name '*.apk'
          find . -type f -name '*.aab'

      - name: Upload Android AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ matrix.variant }}.aab
          path: app/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ matrix.variant }}.apk
          path: app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Ship to Google Play
        if: github.ref_name == 'main'
        # working-directory: app/android
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          GOOGLE_API_CREDENTIALS_FILE: 'api_keys.json'
          ANDROID_BUNDLE_PATH: 'app/android/app/build/outputs/bundle/release/app-release.aab'
          ANDROID_PACKAGE_NAME: ${{ env.ANDROID_PACKAGE_NAME }}
          VERSION_CODE: ${{ env.APP_BUILD_NUMBER }}
          VERSION_NAME: ${{ env.APP_VERSION }}
        run: |
          # when we updated to yarn we started getting an error with paths
          # and had to add `/android` to the path.
          #
          # `op read` to stdout appends a trailing newline, which would corrupt
          # this JSON credentials file. --out-file writes the bytes as-is.
          op read "op://bcsc-mobile-app-cd/google-play-publisher/service-account.json" --out-file "${GOOGLE_API_CREDENTIALS_FILE}" --force && \
          GOOGLE_API_CREDENTIALS="$PWD/${GOOGLE_API_CREDENTIALS_FILE}" npx @bcgov/gpublish

  build-summary:
    runs-on: ubuntu-latest
    permissions: {}
    needs:
      - early-exit-check
      - build-android
      - build-ios
    if: always()
    steps:
      - name: Check matrix results
        env:
          SHOULD_SKIP: ${{ needs.early-exit-check.outputs.should_skip_build }}
          ANDROID_RESULT: ${{ needs.build-android.result }}
          IOS_RESULT: ${{ needs.build-ios.result }}
        run: |
          echo "Debug: should_skip_build=$SHOULD_SKIP"
          echo "Debug: build-android.result=$ANDROID_RESULT"
          echo "Debug: build-ios.result=$IOS_RESULT"

          # If builds were intentionally skipped, that's okay
          if [ "$SHOULD_SKIP" == "true" ]; then
            echo "✅ No relevant file changes. Build skipped intentionally."
            exit 0
          fi

          # Check for actual failures (not skipped)
          if [ "$ANDROID_RESULT" != "success" ] && [ "$ANDROID_RESULT" != "skipped" ]; then
            echo "❌ Android build(s) failed with result: $ANDROID_RESULT"
            exit 1
          fi

          if [ "$IOS_RESULT" != "success" ] && [ "$IOS_RESULT" != "skipped" ]; then
            echo "❌ iOS build(s) failed with result: $IOS_RESULT"
            exit 1
          fi

          # If we didn't skip but builds didn't run, that's an error
          if [ "$ANDROID_RESULT" == "skipped" ] || [ "$IOS_RESULT" == "skipped" ]; then
            echo "⚠️ Warning: Builds were skipped unexpectedly"
            echo "This might indicate an issue with job conditions"
            exit 1
          fi

          echo "✅ All builds passed!"

  # ─── TestFlight Distribution ────────────────────────────────────────
  # Runs on ubuntu (cheap) AFTER builds complete. Waits for Apple's
  # server-side processing then distributes to beta groups.
  # Decoupled from build-ios so the upload→process wait no longer
  # blocks the iOS build critical path.
  distribute-testflight:
    name: 'Distribute TestFlight - ${{ matrix.variant }}'
    if: ${{ always() && !cancelled() && github.ref_name == 'main' }}
    needs: [build-ios, compute-variants]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.compute-variants.outputs.variants) }}
    steps:
      - name: Check iOS build artifact exists
        id: probe
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ios-${{ matrix.variant }}.ipa
          path: ${{ runner.temp }}/probe

      - uses: actions/checkout@v7
        if: steps.probe.outcome == 'success'

      - name: Load variant config
        if: steps.probe.outcome == 'success'
        uses: ./.github/workflows/actions/load-variant-config
        with:
          variant: ${{ matrix.variant }}

      - name: Distribute to TestFlight
        if: steps.probe.outcome == 'success'
        uses: ./.github/workflows/actions/distribute-testflight
        with:
          app_store_connect_issuer_id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          app_store_connect_key_identifier: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER_95 }}
          app_store_connect_private_key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_95 }}
          bundle_id: ${{ env.IOS_BUNDLE_ID }}
          version_code: ${{ github.run_number }}
          version_name: ${{ env.APP_VERSION }}
          beta_groups: ${{ env.TESTFLIGHT_BETA_GROUPS }}

  # ─── Firebase App Distribution ──────────────────────────────────────
  distribute-firebase-ios:
    name: 'Distribute Firebase iOS - ${{ matrix.variant }}'
    if: ${{ always() && !cancelled() && github.ref_name == 'main' }}
    needs: [build-ios, compute-variants]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.compute-variants.outputs.variants) }}
    steps:
      - name: Check iOS build artifact exists
        id: probe
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ios-${{ matrix.variant }}.ipa
          path: ${{ runner.temp }}/firebase-artifact

      - uses: actions/checkout@v7
        if: steps.probe.outcome == 'success'

      - name: Load variant config
        if: steps.probe.outcome == 'success'
        uses: ./.github/workflows/actions/load-variant-config
        with:
          variant: ${{ matrix.variant }}

      - name: Install 1Password CLI
        if: steps.probe.outcome == 'success'
        uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0

      - name: Fetch Firebase credentials
        if: steps.probe.outcome == 'success'
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          # `op read` to stdout appends a trailing newline; --out-file writes
          # the document byte-for-byte instead.
          op read "op://bcsc-mobile-app-cd/google-services-ios-${{ matrix.variant }}/GoogleService-Info.plist" --out-file "${RUNNER_TEMP}/google-services-source" --force
          op read "${FIREBASE_IOS_SA_REF}" --out-file "${RUNNER_TEMP}/firebase-service-account.json" --force

      - name: Distribute to Firebase App Distribution
        if: steps.probe.outcome == 'success'
        uses: ./.github/workflows/actions/distribute-firebase
        with:
          platform: ios
          app_identifier: ${{ env.IOS_BUNDLE_ID }}
          google_services_file: ${{ runner.temp }}/google-services-source
          service_account_file: ${{ runner.temp }}/firebase-service-account.json
          artifact_path: ${{ runner.temp }}/firebase-artifact/BCWallet.ipa
          groups: ${{ env.FIREBASE_IOS_TESTER_GROUPS }}
          version_name: ${{ env.APP_VERSION }}
          version_code: ${{ github.run_number }}

  distribute-firebase-android:
    name: 'Distribute Firebase Android - ${{ matrix.variant }}'
    if: ${{ always() && !cancelled() && github.ref_name == 'main' }}
    needs: [build-android, compute-variants]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.compute-variants.outputs.variants) }}
    steps:
      - name: Check Android build artifact exists
        id: probe
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: android-${{ matrix.variant }}.apk
          path: ${{ runner.temp }}/firebase-artifact

      - uses: actions/checkout@v7
        if: steps.probe.outcome == 'success'

      - name: Load variant config
        if: steps.probe.outcome == 'success'
        uses: ./.github/workflows/actions/load-variant-config
        with:
          variant: ${{ matrix.variant }}

      - name: Install 1Password CLI
        if: steps.probe.outcome == 'success'
        uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0

      - name: Fetch Firebase credentials
        if: steps.probe.outcome == 'success'
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          # `op read` to stdout appends a trailing newline; --out-file writes
          # the document byte-for-byte instead.
          op read "op://bcsc-mobile-app-cd/google-services-android-${{ matrix.variant }}/google-services.json" --out-file "${RUNNER_TEMP}/google-services-source" --force
          op read "${FIREBASE_ANDROID_SA_REF}" --out-file "${RUNNER_TEMP}/firebase-service-account.json" --force

      - name: Distribute to Firebase App Distribution
        if: steps.probe.outcome == 'success'
        uses: ./.github/workflows/actions/distribute-firebase
        with:
          platform: android
          app_identifier: ${{ env.ANDROID_PACKAGE_NAME }}
          google_services_file: ${{ runner.temp }}/google-services-source
          service_account_file: ${{ runner.temp }}/firebase-service-account.json
          artifact_path: ${{ runner.temp }}/firebase-artifact/app-release.apk
          groups: ${{ env.FIREBASE_ANDROID_TESTER_GROUPS }}
          version_name: ${{ env.APP_VERSION }}
          version_code: ${{ github.run_number }}

  ship-to-saucelabs:
    name: 'Ship to SauceLabs - ${{ matrix.variant }} - ${{ matrix.platform }}'
    if: >-
      always() && !cancelled() &&
      github.event.pull_request.head.repo.fork != true &&
      !startsWith(github.base_ref, 'release/') &&
      !startsWith(github.ref_name, 'release/') &&
      needs.early-exit-check.outputs.should_skip_build != 'true'
    needs: [build-ios, build-android, compute-variants, early-exit-check]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, android]
        variant: ${{ fromJSON(needs.compute-variants.outputs.variants) }}
    steps:
      - name: Check build artifact exists
        id: probe
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.platform }}-${{ matrix.variant }}.${{ matrix.platform == 'ios' && 'ipa' || 'apk' }}
          path: ${{ runner.temp }}/probe

      - uses: actions/checkout@v7
        if: steps.probe.outcome == 'success'

      - name: Load variant config
        if: steps.probe.outcome == 'success'
        uses: ./.github/workflows/actions/load-variant-config
        with:
          variant: ${{ matrix.variant }}

      - name: Derive platform artifact names
        if: steps.probe.outcome == 'success'
        run: |
          if [ "${{ matrix.platform }}" = "ios" ]; then
            EXT="ipa"
            INNER_FILENAME="BCWallet.ipa"
          else
            EXT="apk"
            INNER_FILENAME="app-release.apk"
          fi
          cat >> "$GITHUB_ENV" <<EOF
          SAUCE_LABS_NAME=${SAUCE_LABS_PREFIX}-${{ github.run_number }}.${EXT}
          SAUCE_LABS_DESCRIPTION=${{ matrix.platform }} ${APP_NAME}
          ARTIFACT_REF=${{ matrix.platform }}-${{ matrix.variant }}.${EXT}
          ARTIFACT_INNER_NAME=${INNER_FILENAME}
          EOF

      - name: Load SauceLabs secrets from 1Password
        id: op_saucelabs
        if: steps.probe.outcome == 'success'
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SAUCE_USERNAME: op://bcsc-mobile-app-cd/saucelabs/username
          SAUCE_ACCESS_KEY: op://bcsc-mobile-app-cd/saucelabs/credential

      - name: Ship Artifact to SauceLabs
        if: steps.probe.outcome == 'success'
        uses: ./.github/workflows/actions/ship-to-saucelabs
        with:
          sauce_labs_username: ${{ steps.op_saucelabs.outputs.SAUCE_USERNAME }}
          sauce_labs_password: ${{ steps.op_saucelabs.outputs.SAUCE_ACCESS_KEY }}
          sauce_labs_name: ${{ env.SAUCE_LABS_NAME }}
          sauce_labs_description: ${{ env.SAUCE_LABS_DESCRIPTION }}
          artifact_ref: ${{ env.ARTIFACT_REF }}
          artifact_name: ${{ env.ARTIFACT_INNER_NAME }}

  # ─── E2E Tests ──────────────────────────────────────────────────────
  # Delegated to .github/workflows/e2e.yml (reusable workflow).
  # PR: smoke tests on 1 iOS + 1 Android device (fast feedback).
  # Main: the regression suite is deferred to the nightly workflow
  #       (e2e-nightly.yml) which checks for merges in the last 24h
  #       before running. This keeps SauceLabs devices free during the
  #       day when multiple PRs merge.
  #
  # PR smoke is live: the suite targets the v4.1 launch flow (see
  # e2e/test/*/smoke.spec.ts, fixing issue #4148) and `ship-to-saucelabs` is
  # enabled again, so there is an app in Sauce storage to test against.
  #
  # The guard keeps this to non-fork PRs off release branches, where the Sauce/SM
  # secrets are actually available. It deliberately omits `always()` so the job
  # stays tied to a successful `ship-to-saucelabs`.
  #
  # Caveat: `ship-to-saucelabs` runs under `always()` and no-ops (probe step) when
  # a build artifact is missing, so it reports success even when nothing was
  # uploaded. A failed platform build therefore surfaces here as an "app not found"
  # E2E failure on top of the build failure, rather than as a skip.
  e2e:
    needs: [ship-to-saucelabs, compute-variants, early-exit-check]
    permissions:
      contents: read
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.fork != true &&
      !startsWith(github.base_ref, 'release/') &&
      needs.early-exit-check.outputs.should_skip_build != 'true'
    uses: ./.github/workflows/e2e.yml
    with:
      suite: smoke
      build_number: ${{ github.run_number }}
      device_matrix: '[{"platform":"iOS","device":"iPhone.*","os_version":""},{"platform":"Android","device":"Google.*","os_version":""}]'
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
