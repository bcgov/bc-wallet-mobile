# E2E Tests (Reusable + Dispatchable)
#
# This workflow runs WebDriverIO tests against SauceLabs Real Device Cloud.
# Apps must already be uploaded to SauceLabs (see ship-to-saucelabs in main.yaml).
#
# Available suites (defined in e2e/configs/wdio.shared.conf.ts):
#   smoke        — basic launch + first navigation
#   onboarding   — onboarding journeys
#   auth         — auth/unlock journey
#   main         — main navigation + settings + wallet credential journeys (issuer creds from 1Password; needs OP_SERVICE_ACCOUNT_TOKEN)
#   verify       — verify entry + verified card-type journeys (needs SM_* creds)
#   regression   — every per-area journey (nightly default; needs SM_* + OP_SERVICE_ACCOUNT_TOKEN)
#   migration    — v3 → v4 app upgrade flow (Sauce RDC only; separate v3 build)
#
# Device matrix:
#   Callers pass a device_matrix JSON array of {platform, device, os_version}
#   objects. Each entry spawns a separate SauceLabs session.
#   Example: [{"platform":"iOS","device":"iPhone.*","os_version":"18"}]
#
# Trigger modes:
#   workflow_call  — called from main.yaml after builds (PR smoke tests)
#   workflow_dispatch — manual runs from the Actions UI
#
# Constraint: the SauceLabs account allows 2 concurrent real-device sessions, shared across every
# job AND every wdio worker inside them. max-parallel caps the jobs; SAUCE_MAX_INSTANCES (computed
# in the run step) divides the session budget among the jobs running in parallel.
name: E2E Tests

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      suite:
        description: 'Test suite (smoke, onboarding, auth, main, verify, regression, migration)'
        type: string
        required: true
      build_number:
        description: 'Build number for SauceLabs artifact lookup'
        type: string
        required: true
      device_matrix:
        description: 'JSON array of {platform, device, os_version} objects'
        type: string
        required: true
      runner_label:
        description: 'Label of the large runner with whitelisted egress IPs'
        type: string
        required: false
        default: 'ubuntu-latest-m'
    secrets:
      SAUCE_USERNAME:
        required: true
      SAUCE_ACCESS_KEY:
        required: true
      SM_USER:
        required: false
        description: 'SiteMinder username for in-person verification auto-approval (required for verify/regression/migration; omit for smoke/onboarding/auth/main)'
      SM_PASSWORD:
        required: false
        description: 'SiteMinder password for in-person verification auto-approval'
      OP_SERVICE_ACCOUNT_TOKEN:
        required: false
        description: '1Password service-account token — required for main/regression, whose issuer credentials load from the bcsc-mobile-app-cd vault (see e2e/issuer/README.md)'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Test suite to run'
        type: choice
        options:
          - smoke
          - onboarding
          - auth
          - main
          - verify
          - regression
          - migration
        default: smoke
      build_number:
        description: 'Build number (run_number from the build workflow)'
        type: string
        required: true
      device_matrix:
        description: 'JSON array of {platform, device, os_version} objects'
        type: string
        default: '[{"platform":"iOS","device":"iPhone.*","os_version":""},{"platform":"Android","device":"Google.*","os_version":""}]'
      runner_label:
        description: 'Label of the large runner with whitelisted egress IPs'
        type: string
        default: 'ubuntu-latest-m'

jobs:
  # ─── E2E Tests ─────────────────────────────────────────────────────
  # Single unified job for all suites. Config file paths are selected at
  # runtime via a case statement on $SUITE:
  #   migration                → configs/sauce/wdio.{ios,android}.sauce.migration.conf.ts
  #   everything else (smoke,  → configs/sauce/wdio.{ios,android}.sauce.rdc.conf.ts
  #    onboarding, auth, main,
  #    verify, regression)
  #
  # Non-blocking suites (migration): failures are reported but
  # do not gate the pipeline.
  e2e-tests:
    name: '${{ inputs.suite }} - ${{ matrix.device.platform }} ${{ matrix.device.os_version }}'
    runs-on: ${{ inputs.runner_label }}
    permissions:
      contents: read
    # regression runs every journey serially (~50m+ on iOS and growing); other suites (merge-queue smoke) stay tight
    timeout-minutes: ${{ inputs.suite == 'regression' && 90 || 45 }}
    continue-on-error: ${{ inputs.suite == 'migration' }}
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        device: ${{ fromJSON(inputs.device_matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Load variant config
        uses: ./.github/workflows/actions/load-variant-config
        with:
          variant: bcsc-dev

      - name: Setup NodeJS
        uses: ./.github/workflows/actions/setup-node

      - name: Cache E2E dependencies
        uses: actions/cache@v6
        with:
          path: |
            e2e/.yarn/cache
            e2e/node_modules
          key: e2e-deps-${{ hashFiles('e2e/yarn.lock') }}
          restore-keys: e2e-deps-

      - name: Install E2E dependencies
        working-directory: e2e
        run: yarn install --immutable

      # The wallet journey (main + regression suites) drives the e2e issuer — a Traction dev tenant
      # (e2e/issuer/README.md) — over its admin API. This preflight runs the idempotent provisioning
      # script against it: validates tenant + creds, ensures schema/cred def, and resolves their ids.
      # The script logs to stderr and prints ONLY dotenv id lines on stdout — no secrets — so its
      # output feeds $GITHUB_ENV directly. A missing or unreachable issuer fails HERE, with a named
      # cause, before any Sauce session is paid for.
      # The issuer credentials live in the bcsc-mobile-app-cd 1Password vault ("traction" item:
      # username = tenant id, credential = API key); OP_SERVICE_ACCOUNT_TOKEN is the single
      # bootstrap secret that stays in GitHub. export-env feeds them to every step below, so the
      # Run step needs no ISSUER_* env of its own and the script never has to echo them.
      - name: Load issuer credentials from 1Password
        if: contains(fromJSON('["main","regression"]'), inputs.suite)
        uses: 1password/load-secrets-action@e544b780808654ba8ceba5fb2fe2897103d92ff4 # v5.0.0
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          ISSUER_TENANT_ID: op://bcsc-mobile-app-cd/traction/username
          ISSUER_API_KEY: op://bcsc-mobile-app-cd/traction/credential

      - name: Issuer preflight (wallet journey)
        if: contains(fromJSON('["main","regression"]'), inputs.suite)
        working-directory: e2e
        env:
          SUITE: ${{ inputs.suite }} # via env, never inline in run — inputs are attacker-controlled
        run: |
          if [ -z "$ISSUER_TENANT_ID" ] || [ -z "$ISSUER_API_KEY" ]; then
            echo "::error::Suite '$SUITE' includes the wallet journey, but the 1Password issuer credentials are empty (op://bcsc-mobile-app-cd/traction — see e2e/issuer/README.md)"
            exit 1
          fi
          # tsx binary directly — yarn's own stdout banners would corrupt GITHUB_ENV
          ./node_modules/.bin/tsx scripts/issuer-provision.ts >> "$GITHUB_ENV"

      - name: Run WDIO tests
        working-directory: e2e
        env:
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
          SM_USER: ${{ secrets.SM_USER }}
          SM_PASSWORD: ${{ secrets.SM_PASSWORD }}
          SAUCE_REGION: us
          VARIANT: bcsc-dev
          DEVICE_MATRIX: ${{ inputs.device_matrix }}
          # Concurrent real-device sessions the Sauce account allows (its `rds` allowance).
          SAUCE_RDS_CONCURRENCY: 2
          PLATFORM: ${{ matrix.device.platform }}
          IOS_DEVICE_NAME: ${{ matrix.device.platform == 'iOS' && matrix.device.device || '' }}
          IOS_PLATFORM_VERSION: ${{ matrix.device.platform == 'iOS' && matrix.device.os_version || '' }}
          ANDROID_DEVICE_NAME: ${{ matrix.device.platform == 'Android' && matrix.device.device || '' }}
          ANDROID_PLATFORM_VERSION: ${{ matrix.device.platform == 'Android' && matrix.device.os_version || '' }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          SUITE: ${{ inputs.suite }}
          BUILD_NAME: 'build-${{ inputs.build_number }}'
          TEST_NAME: 'E2E ${{ inputs.suite }} - ${{ matrix.device.platform }} ${{ matrix.device.os_version }}'
        run: |
          # Split the account's real-device session budget across the jobs running in parallel.
          # Each matrix entry is a separate wdio process, so without this a 2-device matrix asks
          # for (jobs x maxInstances) sessions; anything over the limit queues inside
          # POST /session until the client aborts and reports "Failed to create a session".
          DEVICE_COUNT=$(printf '%s' "$DEVICE_MATRIX" | jq 'length')
          [ "$DEVICE_COUNT" -ge 1 ] 2>/dev/null || DEVICE_COUNT=1
          PARALLEL_JOBS=$(( DEVICE_COUNT > 2 ? 2 : DEVICE_COUNT ))   # strategy.max-parallel is 2
          export SAUCE_MAX_INSTANCES=$(( SAUCE_RDS_CONCURRENCY / PARALLEL_JOBS ))
          echo "Devices: $DEVICE_COUNT | parallel jobs: $PARALLEL_JOBS | wdio maxInstances: $SAUCE_MAX_INSTANCES"

          case "$SUITE" in
            migration)
              IOS_CONF="configs/sauce/wdio.ios.sauce.migration.conf.ts"
              ANDROID_CONF="configs/sauce/wdio.android.sauce.migration.conf.ts"
              ;;
            *)
              IOS_CONF="configs/sauce/wdio.ios.sauce.rdc.conf.ts"
              ANDROID_CONF="configs/sauce/wdio.android.sauce.rdc.conf.ts"
              ;;
          esac
          if [ "$PLATFORM" = "iOS" ]; then
            IOS_APP_FILENAME="${SAUCE_LABS_PREFIX}-${BUILD_NUMBER}.ipa" \
              yarn wdio "$IOS_CONF" --suite "${SUITE}"
          else
            ANDROID_APP_FILENAME="${SAUCE_LABS_PREFIX}-${BUILD_NUMBER}.apk" \
              yarn wdio "$ANDROID_CONF" --suite "${SUITE}"
          fi

      # Per-scenario JUnit XML + Allure results + failure screenshots (e2e/reports/, gitignored).
      # always() so a failing run still uploads its report. The name is unique per matrix entry —
      # upload-artifact rejects a duplicate name within a run, and each device is its own job.
      - name: Upload E2E reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reports-${{ inputs.suite }}-${{ matrix.device.platform }}-${{ matrix.device.os_version }}
          path: e2e/reports/
          if-no-files-found: warn
          retention-days: 14
