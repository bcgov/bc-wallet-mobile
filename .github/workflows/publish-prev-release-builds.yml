# Publish Previous Release Builds
#
# Run MANUALLY after a release ships to users: pass the ID of the main.yaml
# ("Native Build & Test") run that built the shipped version. The e2e upgrade
# suite (previous release → current) consumes what this publishes.
#
# What it does:
#   1. Downloads that run's bcsc-dev artifacts (android-bcsc-dev.apk /
#      ios-bcsc-dev.ipa). GitHub artifacts expire after 7 DAYS — if they are
#      gone, attach the binaries to the `bcsc-latest-release` release by hand
#      (see e2e/apps/README.md) and dispatch "Refresh E2E Sauce Builds" instead.
#   2. Publishes them as BCSC-prev.apk / BCSC-prev.ipa on the rolling
#      `bcsc-latest-release` GitHub Release (created on first run; afterwards
#      the assets are clobbered and the notes record which version/build they
#      came from — the tag itself never moves).
#   3. Uploads both to Sauce Labs storage under the same names, UNTAGGED (the
#      PR-prune maintenance job only deletes pr-tagged files). Sauce deletes
#      storage files after 60 days of inactivity; the monthly "Refresh E2E
#      Sauce Builds" workflow re-uploads from the rolling release to keep them
#      alive between releases.
#
# Android versionCode = build run number, so "previous" must always be an older
# run than the build under test (Android refuses downgrade installs).
name: Publish Previous Release Builds

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'ID of the main.yaml run that built the shipped release (last number in the run URL)'
        required: true
        type: string
      version_label:
        description: 'Version shipped, for the release notes (e.g. v4.1.0)'
        required: false
        type: string
        default: ''

env:
  RELEASE_TAG: bcsc-latest-release
  PREV_ANDROID_FILENAME: BCSC-prev.apk
  PREV_IOS_FILENAME: BCSC-prev.ipa

jobs:
  publish-prev-builds:
    name: Publish previous-release builds
    runs-on: ubuntu-22.04
    permissions:
      contents: write # create/update the rolling release
      actions: read # inspect + download artifacts from the build run
    timeout-minutes: 15
    steps:
      - name: Validate the build run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          run_json=$(gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}")
          workflow_path=$(echo "$run_json" | jq -r '.path')
          if [ "$workflow_path" != ".github/workflows/main.yaml" ]; then
            echo "::error::Run $RUN_ID is from $workflow_path, not main.yaml — pass the build run that shipped the release"
            exit 1
          fi
          head_branch=$(echo "$run_json" | jq -r '.head_branch')
          if [ "$head_branch" != "main" ]; then
            echo "::warning::Run $RUN_ID built branch '$head_branch', not main — releases normally ship from main"
          fi
          {
            echo "RUN_NUMBER=$(echo "$run_json" | jq -r '.run_number')"
            echo "RUN_URL=$(echo "$run_json" | jq -r '.html_url')"
            echo "HEAD_SHA=$(echo "$run_json" | jq -r '.head_sha')"
          } >> "$GITHUB_ENV"

      - name: Download bcsc-dev artifacts from the build run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          gh run download "$RUN_ID" --repo "${{ github.repository }}" --name android-bcsc-dev.apk --dir dl/android
          gh run download "$RUN_ID" --repo "${{ github.repository }}" --name ios-bcsc-dev.ipa --dir dl/ios
          mv dl/android/app-release.apk "$PREV_ANDROID_FILENAME"
          mv dl/ios/BCWallet.ipa "$PREV_IOS_FILENAME"
          ls -la "$PREV_ANDROID_FILENAME" "$PREV_IOS_FILENAME"

      - name: Create or update the rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_LABEL: ${{ inputs.version_label }}
        run: |
          notes="bcsc-dev ${VERSION_LABEL:-(unlabelled)} build ${RUN_NUMBER} from ${RUN_URL} — rolling previous-release binaries for the e2e upgrade suite."
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$PREV_ANDROID_FILENAME" "$PREV_IOS_FILENAME" \
              --repo "${{ github.repository }}" --clobber
            gh release edit "$RELEASE_TAG" --repo "${{ github.repository }}" --notes "$notes"
          else
            gh release create "$RELEASE_TAG" "$PREV_ANDROID_FILENAME" "$PREV_IOS_FILENAME" \
              --repo "${{ github.repository }}" \
              --target "$HEAD_SHA" \
              --title "Previous released build (e2e upgrade suite)" \
              --notes "$notes" \
              --latest=false
          fi

      - name: Load SauceLabs secrets from 1Password
        id: op_saucelabs
        uses: 1password/load-secrets-action@e544b780808654ba8ceba5fb2fe2897103d92ff4 # v5.0.0
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SAUCE_USERNAME: op://bcsc-mobile-app-cd/saucelabs/username
          SAUCE_ACCESS_KEY: op://bcsc-mobile-app-cd/saucelabs/credential

      - name: Upload previous Android build to SauceLabs
        env:
          SAUCE_USERNAME: ${{ steps.op_saucelabs.outputs.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ steps.op_saucelabs.outputs.SAUCE_ACCESS_KEY }}
        run: |
          response=$(curl -s -w "\n%{http_code}" \
            -u "$SAUCE_USERNAME:$SAUCE_ACCESS_KEY" \
            --location --request POST \
            'https://api.us-west-1.saucelabs.com/v1/storage/upload' \
            --form "payload=@\"$PREV_ANDROID_FILENAME\"" \
            --form "name=\"$PREV_ANDROID_FILENAME\"")
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | sed '$d')
          echo "$body"
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::SauceLabs upload failed with HTTP $http_code"
            exit 1
          fi
          echo "✓ Uploaded $PREV_ANDROID_FILENAME (HTTP $http_code)"

      - name: Upload previous iOS build to SauceLabs
        env:
          SAUCE_USERNAME: ${{ steps.op_saucelabs.outputs.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ steps.op_saucelabs.outputs.SAUCE_ACCESS_KEY }}
        run: |
          response=$(curl -s -w "\n%{http_code}" \
            -u "$SAUCE_USERNAME:$SAUCE_ACCESS_KEY" \
            --location --request POST \
            'https://api.us-west-1.saucelabs.com/v1/storage/upload' \
            --form "payload=@\"$PREV_IOS_FILENAME\"" \
            --form "name=\"$PREV_IOS_FILENAME\"")
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | sed '$d')
          echo "$body"
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::SauceLabs upload failed with HTTP $http_code"
            exit 1
          fi
          echo "✓ Uploaded $PREV_IOS_FILENAME (HTTP $http_code)"
