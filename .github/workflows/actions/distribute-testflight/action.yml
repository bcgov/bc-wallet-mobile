name: Distribute to TestFlight
description: |
  Wait for App Store Connect to finish processing a build, then
  set its "What to Test" text, distribute it to the specified TestFlight
  beta groups and submit it for Beta App Review.
  Runs on ubuntu (no macOS needed — purely API calls).

inputs:
  app_store_connect_issuer_id:
    description: The App Store Connect API issuer ID
    required: true
  app_store_connect_key_identifier:
    description: The App Store Connect API key identifier
    required: true
  app_store_connect_private_key:
    description: The App Store Connect API private key (.p8 contents)
    required: true
  bundle_id:
    description: The iOS bundle identifier (e.g. ca.bc.gov.BCWallet)
    required: true
  version_code:
    description: |
      The build number to wait for. i.e 1471
    required: true
  version_name:
    description: |
      The version name of the build to wait for. i.e 1.0.1
    required: true
  what_to_test:
    description: |
      The build's TestFlight "What to Test" text, set for en-US and en-CA
      after a "Release <version_name>-<version_code>" line. Empty sends
      only that line.
    required: false
    default: ''
  beta_groups:
    description: |
      Newline-separated TestFlight beta group names to distribute
      the build to. One group per line.
    required: true
  max_wait_minutes:
    description: Maximum minutes to wait for Apple processing
    required: false
    default: '15'

runs:
  using: composite
  steps:
    - name: Generate JWT for App Store Connect API
      id: jwt
      uses: ./.github/workflows/actions/asc-jwt
      with:
        app_store_connect_issuer_id: ${{ inputs.app_store_connect_issuer_id }}
        app_store_connect_key_identifier: ${{ inputs.app_store_connect_key_identifier }}
        app_store_connect_private_key: ${{ inputs.app_store_connect_private_key }}

    - name: Wait for build processing & distribute
      shell: bash
      env:
        ASC_TOKEN: ${{ steps.jwt.outputs.token }}
        BUNDLE_ID: ${{ inputs.bundle_id }}
        VERSION_CODE: ${{ inputs.version_code }}
        VERSION_NAME: ${{ inputs.version_name }}
        WHAT_TO_TEST: ${{ inputs.what_to_test }}
        BETA_GROUPS: ${{ inputs.beta_groups }}
        MAX_WAIT: ${{ inputs.max_wait_minutes }}
      run: |
        set -euo pipefail
        API="https://api.appstoreconnect.apple.com/v1"
        AUTH="Authorization: Bearer ${ASC_TOKEN}"

        # Helper: GET from ASC API with full response-body logging on errors.
        # Prints JSON response to stdout on success; returns 1 and prints
        # the error response body to stderr on HTTP >= 400 or connection failure.
        asc_get() {
          local url="$1"
          local _rf; _rf=$(mktemp)
          local _code
          _code=$(curl -sg -o "$_rf" -w '%{http_code}' -H "$AUTH" "$url") || _code="000"
          if [ "$_code" -ge 400 ] 2>/dev/null || [ "$_code" = "000" ]; then
            echo "⚠️  ASC API error (HTTP ${_code}): GET ${url}" >&2
            python3 -m json.tool < "$_rf" >&2 2>/dev/null || cat "$_rf" >&2 2>/dev/null || true
            rm -f "$_rf"
            return 1
          fi
          cat "$_rf"
          rm -f "$_rf"
        }

        # Resolve bundle ID to App Store Connect app resource ID
        echo "Resolving app ID for bundle: ${BUNDLE_ID}..."
        APP_RESPONSE=$(asc_get "${API}/apps?filter[bundleId]=${BUNDLE_ID}&limit=1") \
          || APP_RESPONSE='{"data":[]}'
        APP_ID=$(echo "$APP_RESPONSE" | \
          python3 -c "import sys,json; d=json.load(sys.stdin)['data']; print(d[0]['id'] if d else '')")
        if [ -z "$APP_ID" ]; then
          echo "❌ Could not find app with bundle ID: ${BUNDLE_ID}"
          exit 1
        fi
        echo "Resolved app ID: ${APP_ID}"

        echo "::group::Waiting for build ${VERSION_CODE} to finish processing..."

        # Poll until the build appears and finishes processing.
        # If the build stays NOT_FOUND for >3 min, bail early — the upload
        # step was probably skipped or failed.
        ELAPSED=0
        INTERVAL=30
        MAX_SECONDS=$((MAX_WAIT * 60))
        NOT_FOUND_THRESHOLD=180  # seconds — bail early if build never appears
        BUILD_ID=""
        STATE=""

        while [ $ELAPSED -lt $MAX_SECONDS ]; do
          RESPONSE=$(asc_get \
            "${API}/builds?filter[app]=${APP_ID}&filter[version]=${VERSION_CODE}&filter[preReleaseVersion.version]=${VERSION_NAME}&limit=1") \
            || RESPONSE='{"data":[]}'

          PROCESSING_STATE=$(echo "$RESPONSE" | python3 -c "
        import sys, json
        data = json.load(sys.stdin).get('data', [])
        if data:
            print(data[0]['attributes'].get('processingState', 'UNKNOWN'))
            print(data[0]['id'])
        else:
            print('NOT_FOUND')
            print('')
        " 2>/dev/null || echo -e "ERROR\n")

          STATE=$(echo "$PROCESSING_STATE" | head -1)
          BUILD_ID=$(echo "$PROCESSING_STATE" | tail -1)

          echo "  [${ELAPSED}s] Build processing state: ${STATE}"

          if [ "$STATE" = "VALID" ]; then
            echo "✅ Build processing complete!"
            break
          elif [ "$STATE" = "INVALID" ]; then
            echo "❌ Build was marked INVALID by App Store Connect"
            exit 1
          elif [ "$STATE" = "NOT_FOUND" ] && [ "$ELAPSED" -ge "$NOT_FOUND_THRESHOLD" ]; then
            echo ""
            echo "❌ Build ${VERSION_CODE} (${VERSION_NAME}) not found after ${NOT_FOUND_THRESHOLD}s."
            echo "   The build was likely never uploaded to App Store Connect."
            echo "   Check that the 'Ship to Apple App Store' step completed successfully."
            exit 1
          fi

          sleep $INTERVAL
          ELAPSED=$((ELAPSED + INTERVAL))
        done

        if [ "$STATE" != "VALID" ]; then
          echo "❌ Timed out after ${MAX_WAIT} minutes waiting for build ${VERSION_CODE} to finish processing (last state: ${STATE:-unknown})"
          exit 1
        fi

        echo "::endgroup::"

        # --- Set export compliance (required before distribution) ---
        echo "::group::Setting export compliance..."

        # Check if the build already has compliance info set
        COMPLIANCE=$(asc_get "${API}/builds/${BUILD_ID}/buildBetaDetail") \
          || COMPLIANCE='{}'

        AUTO_NOTIFY=$(echo "$COMPLIANCE" | python3 -c "
        import sys, json
        data = json.load(sys.stdin).get('data', {})
        attrs = data.get('attributes', {}) if isinstance(data, dict) else {}
        enc = attrs.get('externalBuildState', '')
        print(enc)
        " 2>/dev/null || echo '')

        echo "External build state: ${AUTO_NOTIFY}"

        # Check if non-exempt encryption usage needs to be declared
        ENCRYPT_STATUS=$(asc_get "${API}/builds/${BUILD_ID}") \
          || ENCRYPT_STATUS='{"data":{}}'

        USES_ENCRYPT=$(echo "$ENCRYPT_STATUS" | python3 -c "
        import sys, json
        data = json.load(sys.stdin).get('data', {})
        attrs = data.get('attributes', {})
        print(attrs.get('usesNonExemptEncryption', 'UNSET'))
        " 2>/dev/null || echo 'UNSET')

        echo "usesNonExemptEncryption: ${USES_ENCRYPT}"

        # If encryption usage hasn't been declared, set it to false
        # (standard HTTPS/TLS is exempt from export compliance)
        if [ "$USES_ENCRYPT" = "None" ] || [ "$USES_ENCRYPT" = "UNSET" ] || [ -z "$USES_ENCRYPT" ]; then
          echo "Setting usesNonExemptEncryption = false..."
          HTTP_CODE=$(curl -s -o /tmp/compliance_response.json -w '%{http_code}' \
            -X PATCH \
            -H "$AUTH" \
            -H "Content-Type: application/json" \
            -d "{\"data\":{\"type\":\"builds\",\"id\":\"${BUILD_ID}\",\"attributes\":{\"usesNonExemptEncryption\":false}}}" \
            "${API}/builds/${BUILD_ID}")
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "⚠️ Failed to set export compliance (HTTP ${HTTP_CODE}), continuing..."
            cat /tmp/compliance_response.json 2>/dev/null || true
          else
            echo "✅ Export compliance set"
          fi
        else
          echo "✅ Export compliance already declared"
        fi

        echo "::endgroup::"

        # "What to Test" is per build and per locale, and external testers
        # cannot get the build while a locale is missing it. It is set before
        # the group is added, so a wider ring never gets the build while it
        # still carries the previous ring's notes. A failure here is a hard
        # failure: swallowing it is what left en-CA empty unnoticed.
        echo "::group::Setting What to Test..."
        LOC_RESPONSE=$(asc_get "${API}/builds/${BUILD_ID}/betaBuildLocalizations") || {
          echo "❌ Failed to fetch the build's localizations" >&2
          exit 1
        }

        for LOCALE in en-US en-CA; do
          # The text reaches python through the environment so quotes and
          # newlines in it stay data rather than breaking the JSON.
          read -r METHOD URL BODY_FILE < <(LOC_RESPONSE="$LOC_RESPONSE" LOCALE="$LOCALE" API="$API" BUILD_ID="$BUILD_ID" python3 -c "
        import json, os, tempfile
        locale = os.environ['LOCALE']
        existing = next((l['id'] for l in json.loads(os.environ['LOC_RESPONSE']).get('data', [])
                         if l['attributes'].get('locale') == locale), None)
        notes = f\"Release {os.environ['VERSION_NAME']}-{os.environ['VERSION_CODE']}\"
        if os.environ['WHAT_TO_TEST'].strip():
            notes += '\n\n' + os.environ['WHAT_TO_TEST']
        attributes = {'whatsNew': notes}
        if existing:
            method, url = 'PATCH', f\"{os.environ['API']}/betaBuildLocalizations/{existing}\"
            body = {'data': {'type': 'betaBuildLocalizations', 'id': existing, 'attributes': attributes}}
        else:
            method, url = 'POST', f\"{os.environ['API']}/betaBuildLocalizations\"
            body = {'data': {'type': 'betaBuildLocalizations',
                             'attributes': {'locale': locale, **attributes},
                             'relationships': {'build': {'data': {'type': 'builds', 'id': os.environ['BUILD_ID']}}}}}
        fd, path = tempfile.mkstemp()
        with os.fdopen(fd, 'w') as f:
            json.dump(body, f)
        print(method, url, path)
        ")

          HTTP_CODE=$(curl -s -o /tmp/what_to_test_response.json -w '%{http_code}' \
            -X "$METHOD" \
            -H "$AUTH" \
            -H "Content-Type: application/json" \
            --data-binary "@${BODY_FILE}" \
            "$URL")
          rm -f "$BODY_FILE"

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "❌ Failed to set What to Test for ${LOCALE} (HTTP ${HTTP_CODE}):"
            python3 -m json.tool < /tmp/what_to_test_response.json 2>/dev/null || cat /tmp/what_to_test_response.json 2>/dev/null || true
            exit 1
          fi
          echo "✅ What to Test set for ${LOCALE}"
        done

        echo "::endgroup::"

        # Without automatic notification an approved build is not distributed
        # until someone presses Notify Testers. Set before the group is added,
        # so an already-approved build reaches the new group straight away and
        # one still in review is distributed when it passes.
        echo "::group::Enabling automatic tester notification..."
        DETAIL=$(asc_get "${API}/builds/${BUILD_ID}/buildBetaDetail") || {
          echo "❌ Failed to fetch the build's beta details" >&2
          exit 1
        }
        read -r DETAIL_ID AUTO_NOTIFY_ENABLED < <(echo "$DETAIL" | python3 -c "
        import sys, json
        data = json.load(sys.stdin).get('data', {})
        print(data.get('id', ''), str(data.get('attributes', {}).get('autoNotifyEnabled', False)).lower())
        ")
        if [ "$AUTO_NOTIFY_ENABLED" = "true" ]; then
          echo "✅ Already enabled"
        else
          HTTP_CODE=$(curl -s -o /tmp/auto_notify_response.json -w '%{http_code}' \
            -X PATCH \
            -H "$AUTH" \
            -H "Content-Type: application/json" \
            -d "{\"data\":{\"type\":\"buildBetaDetails\",\"id\":\"${DETAIL_ID}\",\"attributes\":{\"autoNotifyEnabled\":true}}}" \
            "${API}/buildBetaDetails/${DETAIL_ID}")
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "❌ Failed to enable automatic tester notification (HTTP ${HTTP_CODE}):"
            python3 -m json.tool < /tmp/auto_notify_response.json 2>/dev/null || cat /tmp/auto_notify_response.json 2>/dev/null || true
            exit 1
          fi
          echo "✅ Enabled"
        fi
        echo "::endgroup::"

        # --- Distribute to beta groups ---
        echo "::group::Distributing build to TestFlight beta groups..."

        # Collect beta group names
        GROUPS=()
        while IFS= read -r group; do
          group="$(echo "$group" | xargs)"
          [ -n "$group" ] && GROUPS+=("$group")
        done <<< "$BETA_GROUPS"

        if [ ${#GROUPS[@]} -eq 0 ]; then
          echo "⚠️ No beta groups provided, skipping distribution"
          exit 0
        fi

        # Fetch every page of beta groups for the app (APP_ID was resolved
        # above). A single page (the API defaults to far fewer than most
        # apps' group count) would silently miss groups added after the
        # first 50-ish — so page through `links.next` until it's absent. A
        # failed page fetch is a hard failure: silently treating it as "no
        # groups" would misreport a real API error as "group missing".
        ALL_GROUPS_FILE=$(mktemp)
        echo '[]' > "$ALL_GROUPS_FILE"
        PAGE_URL="${API}/apps/${APP_ID}/betaGroups?limit=200"
        while [ -n "$PAGE_URL" ]; do
          PAGE_RESPONSE=$(asc_get "$PAGE_URL") || {
            echo "❌ Failed to fetch beta groups (GET ${PAGE_URL})" >&2
            exit 1
          }
          PAGE_URL=$(PAGE="$PAGE_RESPONSE" GROUPS_FILE="$ALL_GROUPS_FILE" python3 -c "
        import json, os
        page = json.loads(os.environ['PAGE'])
        groups_file = os.environ['GROUPS_FILE']
        with open(groups_file) as f:
            acc = json.load(f)
        acc.extend(page.get('data', []))
        with open(groups_file, 'w') as f:
            json.dump(acc, f)
        print(page.get('links', {}).get('next') or '')
        ")
        done

        # Group names reach python through the environment, not by being
        # pasted into the source: a name containing a quote would otherwise
        # change the program rather than the data. Matching is done as name
        # sets (not a bash line count vs. a python-deduplicated ID count) so
        # duplicate requested names or duplicate matches can't disagree.
        ID_LIST=$(GROUPS_FILE="$ALL_GROUPS_FILE" BETA_GROUPS="${BETA_GROUPS}" python3 -c "
        import os, sys, json
        with open(os.environ['GROUPS_FILE']) as f:
            groups = json.load(f)
        requested = {g.strip() for g in os.environ['BETA_GROUPS'].split('\n') if g.strip()}
        matched = {}
        for g in groups:
            name = g['attributes'].get('name', '')
            if name in requested:
                matched[name] = g['id']
        missing = requested - matched.keys()
        if missing:
            print(f'❌ Beta group(s) not found: {\", \".join(sorted(missing))}', file=sys.stderr)
            print('Available groups:', file=sys.stderr)
            for g in groups:
                print(f'  - {g[\"attributes\"].get(\"name\", \"unknown\")}', file=sys.stderr)
            sys.exit(1)
        for gid in dict.fromkeys(matched.values()):
            print(gid)
        ")
        MATCHED_COUNT=$(echo "$ID_LIST" | grep -c . || true)

        # Add build to each beta group
        PAYLOAD=$(echo "$ID_LIST" | python3 -c "
        import sys, json
        ids = [line.strip() for line in sys.stdin if line.strip()]
        data = [{'type': 'betaGroups', 'id': gid} for gid in ids]
        print(json.dumps({'data': data}))
        ")

        HTTP_CODE=$(curl -s -o /tmp/beta_group_response.json -w '%{http_code}' \
          -X POST \
          -H "$AUTH" \
          -H "Content-Type: application/json" \
          -d "$PAYLOAD" \
          "${API}/builds/${BUILD_ID}/relationships/betaGroups")

        if [ "$HTTP_CODE" -ge 400 ]; then
          echo "❌ Failed to add build to beta groups (HTTP ${HTTP_CODE}):"
          cat /tmp/beta_group_response.json 2>/dev/null | python3 -m json.tool 2>/dev/null || cat /tmp/beta_group_response.json 2>/dev/null || true
          exit 1
        fi

        echo ""
        echo "✅ Build ${VERSION_CODE} distributed to ${MATCHED_COUNT} beta group(s)"

        echo "::endgroup::"

        # External testers only get a build once it passes Beta App Review,
        # and adding it to a group through the API does not submit it. A build
        # approved while automatic notification was off was never distributed,
        # so it is distributed here instead of being taken as done.
        echo "::group::Submitting for Beta App Review..."
        DETAIL=$(asc_get "${API}/builds/${BUILD_ID}/buildBetaDetail") || {
          echo "❌ Failed to fetch the build's beta state" >&2
          exit 1
        }
        EXTERNAL_STATE=$(echo "$DETAIL" | python3 -c "
        import sys, json
        print(json.load(sys.stdin).get('data', {}).get('attributes', {}).get('externalBuildState', ''))
        ")
        echo "External build state: ${EXTERNAL_STATE}"

        case "$EXTERNAL_STATE" in
          READY_FOR_BETA_SUBMISSION)
            HTTP_CODE=$(curl -s -o /tmp/beta_review_response.json -w '%{http_code}' \
              -X POST \
              -H "$AUTH" \
              -H "Content-Type: application/json" \
              -d "{\"data\":{\"type\":\"betaAppReviewSubmissions\",\"relationships\":{\"build\":{\"data\":{\"type\":\"builds\",\"id\":\"${BUILD_ID}\"}}}}}" \
              "${API}/betaAppReviewSubmissions")
            if [ "$HTTP_CODE" -ge 400 ]; then
              echo "❌ Failed to submit for Beta App Review (HTTP ${HTTP_CODE}):"
              python3 -m json.tool < /tmp/beta_review_response.json 2>/dev/null || cat /tmp/beta_review_response.json 2>/dev/null || true
              exit 1
            fi
            echo "✅ Submitted for Beta App Review"
            ;;
          BETA_APPROVED|READY_FOR_BETA_TESTING)
            HTTP_CODE=$(curl -s -o /tmp/beta_notify_response.json -w '%{http_code}' \
              -X POST \
              -H "$AUTH" \
              -H "Content-Type: application/json" \
              -d "{\"data\":{\"type\":\"buildBetaNotifications\",\"relationships\":{\"build\":{\"data\":{\"type\":\"builds\",\"id\":\"${BUILD_ID}\"}}}}}" \
              "${API}/buildBetaNotifications")
            if [ "$HTTP_CODE" -ge 400 ]; then
              echo "❌ Build is approved but notifying testers failed (HTTP ${HTTP_CODE}):"
              python3 -m json.tool < /tmp/beta_notify_response.json 2>/dev/null || cat /tmp/beta_notify_response.json 2>/dev/null || true
              exit 1
            fi
            echo "✅ Approved build distributed to testers"
            ;;
          WAITING_FOR_BETA_REVIEW|IN_BETA_REVIEW)
            echo "✅ In review (${EXTERNAL_STATE}); testers are notified automatically once it is approved"
            ;;
          IN_BETA_TESTING)
            echo "✅ Already in testing; the new group is notified automatically"
            ;;
          *)
            echo "❌ Build ${VERSION_CODE} cannot reach external testers from state '${EXTERNAL_STATE:-unknown}'. Resolve it in App Store Connect, then re-run."
            exit 1
            ;;
        esac

        echo "::endgroup::"
