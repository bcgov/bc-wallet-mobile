# Checks that a PR asking for review is linked to an issue and has its template
# sections filled in. Deterministic — no judgement calls, and one GraphQL query
# unless it has to wait for GitHub to register the issue link. A second job
# copies the linked issue's milestone onto the PR.
#
# Lands non-blocking. Make it a required check on `main` and `release/**` only
# after it has run quietly for a week (see the rollout plan).
name: PR Hygiene

on:
  pull_request:
    # `labeled`/`unlabeled` matter: the escape-hatch labels are usually added in
    # response to a red check, and without them nothing re-evaluates.
    types: [opened, reopened, ready_for_review, converted_to_draft, edited, synchronize, labeled, unlabeled]
  merge_group:

permissions: {}

concurrency:
  group: pr-hygiene-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: PR hygiene
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/pr-hygiene
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const script = require('./scripts/pr-hygiene/check.js')
            await script({ github, context, core })

  milestone:
    name: Sync milestone
    if: github.event_name == 'pull_request' && !contains(fromJSON('["labeled","unlabeled","synchronize"]'), github.event.action)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/pr-hygiene
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const script = require('./scripts/pr-hygiene/sync-milestone.js')
            await script({ github, context, core })
