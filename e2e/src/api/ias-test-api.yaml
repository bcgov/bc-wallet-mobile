openapi: 3.0.3
info:
  title: BCSC Mobile E2E Test API
  version: "1.0"
  description: |
    Non-production API for BCSC mobile app e2e tests to provision bare test
    identities and drive IDV/account-state transitions without automating
    the ID Check UI.

    **Implemented.** These calls write tables and return their documented success status.

    - POST /accounts
    - POST /verifications/{usercode}/decision with channel COUNTER
    - POST /accounts/{usercode}/card-status
    - POST /accounts/mobile-app/{usercode}/status
    - POST /accounts/mobile-app/{usercode}/expiry
    - POST /accounts/{usercode}/card-renewal
    - POST /accounts/{csn}/address-update

    **Not implemented.** These return 501 and write nothing.

    - POST /verifications/{usercode}/decision with channel LIVE_VIDEO or SEND_VIDEO
    - POST /registrations/{usercode}/email-verification/complete
servers:
  - url: /test/idv/v1

tags:
  - name: Implemented
    description: These calls write tables and return their documented success status.
  - name: Not implemented
    description: These calls return 501 and write nothing.

components:
  securitySchemes:
    iasOAuth2:
      type: oauth2
      description: >
        Client-credentials JWT from the environment's IAS oauth2-server.
        Request only the scopes your client needs.
      flows:
        clientCredentials:
          tokenUrl: /oauth2/token
          scopes:
            test-idv-accounts: Create test card identities and change card, mobile app, and address state.
            test-idv-verify: Approve or decline identity verifications as a simulated agent.

  schemas:
    CardType:
      type: string
      enum: [COMBO, STANDALONE, NONPHOTO, NA]

    Decision:
      type: string
      enum: [APPROVE, DECLINE]

    VerificationChannel:
      type: string
      enum: [COUNTER, LIVE_VIDEO, SEND_VIDEO]

    CreateCardIdentityRequest:
      type: object
      description: >
        Mimics ICBC issuing a new BC Services Card to a new individual/
        identity (registerIdentityAndServicesCard), as distinct from a
        renewal or replacement of an existing card. Any identity attribute
        left unspecified is randomly generated, same as today's
        /account/create behaviour. Attribute names match CardRenewalRequest
        so the same values can be reused/asserted across both calls.
      required: [cardType]
      properties:
        cardType:
          $ref: '#/components/schemas/CardType'
        birthDate:
          type: string
          format: date
          description: >
            Optional. If omitted, a birth date is randomly generated for an
            individual aged 16 to 80 inclusive (or within ageFrom/ageTo if
            provided).
        ageFrom:
          type: integer
          description: Optional. Lower bound used when generating birthDate, if birthDate is omitted. Defaults to 16.
        ageTo:
          type: integer
          description: Optional. Upper bound used when generating birthDate, if birthDate is omitted. Defaults to 80.
        surname:
          type: string
        givenName1:
          type: string
        givenName2:
          type: string
        givenName3:
          type: string
        gender:
          type: string
          description: ICBC gender code as carried on the card (e.g. M/F/X). Randomly generated if omitted.
        cardAddressLine1:
          type: string
        cardAddressLine2:
          type: string
        cardAddressLine3:
          type: string
        cardAddressLine4:
          type: string
        postalCode:
          type: string
        groupingLabel:
          type: string
          description: Optional label for later lookup/cleanup, same convention as /account/create.

    CreateCardIdentityResponse:
      type: object
      properties:
        csn:
          type: string
          description: Card serial number, used by the mobile app to "scan" the card.
        birthDate:
          type: string
          format: date
        transactionId:
          type: string

    VerificationDecisionRequest:
      type: object
      required: [channel, decision]
      properties:
        channel:
          $ref: '#/components/schemas/VerificationChannel'
        decision:
          $ref: '#/components/schemas/Decision'
        userMessage:
          type: string
          maxLength: 500
          description: >
            Plain-text message shown to the user. Required for DECLINE;
            may contain line breaks encoded as \n. Stored in
            IIS.IDENTITY_ACTIVITY_LOG.ID_ACTIVITY_LOG_COMMENT, which is
            VARCHAR2(500).
        internalComment:
          type: string
          maxLength: 500
          description: >
            Internal staff comment recorded in the IIS activity log. Required
            for DECLINE; not shown to the user. Same 500-character column as
            userMessage.
      oneOf:
        - properties:
            decision:
              type: string
              enum: [APPROVE]
        - required: [userMessage, internalComment]
          properties:
            decision:
              type: string
              enum: [DECLINE]

    CompleteRegistrationEmailVerificationRequest:
      type: object
      required: [expectedEmailAddress]
      properties:
        expectedEmailAddress:
          type: string
          format: email
          description: >
            Expected address entered in the mobile app. Must match the pending
            email associated with this device registration. Used only as a
            match guard; it does not change the verified identity email.

    VerifyResponse:
      type: object
      properties:
        status:
          type: string
          enum: [VERIFIED, DECLINED]

    CardEventType:
      type: string
      enum: [SUSPEND, UNSUSPEND, CANCEL]

    ChangeCardStatusRequest:
      type: object
      required: [cardEventType]
      properties:
        cardEventType:
          $ref: '#/components/schemas/CardEventType'

    ChangeMobileAppStatusRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          description: >
            Remedy number, the same value an agent types on the ID Search
            Change Mobile App Status screen. 1 to 25 letters or digits.
            Stored in the status comment as "changed device status as per
            remedy ticket" plus this value. This is not the new status.
            The caller does not send a status. Activated becomes Suspended,
            and Suspended becomes Activated.

    SetMobileAppExpiryRequest:
      type: object
      required: [expiryDate]
      properties:
        expiryDate:
          type: string
          format: date-time
          description: >
            Explicit expiry to set, unlike the support tool's fixed
            "extend by N days" behaviour. Accepts a date-time in the past,
            at the present instant, or in the future. A value strictly
            before the current time also sets the mobile app status to
            Expired. A present or future value leaves the app Activated.
            Future dates are used to trigger the mobile app's
            expiry-reminder notifications ahead of time.

    SetMobileAppExpiryResponse:
      type: object
      required: [expiryDate]
      properties:
        expiryDate:
          type: string
          format: date-time
          description: The expiry date that was stored.

    CardRenewalRequest:
      type: object
      description: >
        Issues a renewed or replacement physical BCSC for the card registered
        to the mobile app. cardExpiryDate selects the process. The same date
        as the current card expiry is a replace for an Activated card. A date
        after today and after the current expiry is a renew. A Deactivated
        card follows BCSC011, which reports a matching expiry as a renew.
        Surname, given names, gender, and address are optional. Sent values
        replace the current ones. Omitted values stay as they are.
      required: [cardExpiryDate]
      properties:
        cardExpiryDate:
          type: string
          format: date
          description: >
            The expiry date of the new card. The same date as the current
            expiry is a replace for an Activated card. A date after today and
            after the current expiry is a renew.
        surname:
          type: string
        givenName1:
          type: string
        givenName2:
          type: string
        givenName3:
          type: string
        gender:
          type: string
          description: Gender code M, F, X, or U.
        cardAddressLine1:
          type: string
        cardAddressLine2:
          type: string
        cardAddressLine3:
          type: string
        cardAddressLine4:
          type: string
        postalCode:
          type: string

    CardRenewalResponse:
      type: object
      properties:
        csn:
          type: string
          description: Card serial number of the new card.
        registrationProcessType:
          type: string
          description: >
            RENEW_SERVICES_CARD or REPLACE_SERVICES_CARD, the process used to
            issue the card.
          enum: [RENEW_SERVICES_CARD, REPLACE_SERVICES_CARD]

    AddressUpdateRequest:
      type: object
      description: >
        Account address only. No new card is issued, and the address printed
        on the card stays as it is. The ICBC parser reads the city and
        province from the address lines. Put the street on line 1
        and the city and province on the next line, for example line 1
        "1 MAIN ST" and line 2 "VICTORIA BC". city must start with that
        parsed city, and province must equal the parsed province. Both are
        uppercase.
      required: [cardAddressLine1, city, province, postalCode]
      properties:
        cardAddressLine1:
          type: string
          description: Street line, for example "1 MAIN ST".
        cardAddressLine2:
          type: string
          description: City and province when they are not on line 1, for example "VICTORIA BC".
        cardAddressLine3:
          type: string
        cardAddressLine4:
          type: string
        city:
          type: string
          description: Uppercase. Must start with the city parsed from the address lines.
        province:
          type: string
          description: Uppercase province code. Must equal the province parsed from the address lines, for example BC.
        postalCode:
          type: string
        cardAddressEffectiveDate:
          type: string
          format: date
          description: Optional. Defaults to today if omitted.

    AddressUpdateResponse:
      type: object
      properties:
        csn:
          type: string
        incomingAddressUpdateId:
          type: integer
          format: int64
        status:
          type: string
          description: >
            Received. The row is saved before this response. Address processing
            continues after the response and may later set Processed, Error,
            On Hold, or Not Applied.

paths:
  /accounts:
    post:
      tags: [Implemented]
      summary: Issue a new BC Services Card to a new, bare/unverified identity
      security:
        - iasOAuth2: [test-idv-accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCardIdentityRequest' }
      responses:
        '200':
          description: Card identity created successfully.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateCardIdentityResponse' }

  /verifications/{usercode}/decision:
    post:
      tags: [Implemented]
      summary: Record an identity verification decision for a mobile app registration
      description: >
        COUNTER is implemented. LIVE_VIDEO and SEND_VIDEO return 501 and
        write nothing.
      security:
        - iasOAuth2: [test-idv-verify]
      parameters:
        - name: usercode
          in: path
          required: true
          schema: { type: string }
          description: Usercode displayed by the mobile app during its registration flow.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerificationDecisionRequest' }
      responses:
        '200':
          description: Verification decision recorded for channel COUNTER.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerifyResponse' }
        '501':
          description: >
            channel is LIVE_VIDEO or SEND_VIDEO. The response body is empty
            and nothing is written.

  /registrations/{usercode}/email-verification/complete:
    post:
      tags: [Not implemented]
      summary: Complete pending email verification for a device registration
      description: >
        Returns 501 and writes nothing. When this call is implemented it
        completes verification of the email associated with this device
        registration only. It does not modify the email associated with the
        verified identity. The supplied address is a match guard and must
        equal the pending registration email; it is not logged or returned.
      security:
        - iasOAuth2: [test-idv-verify]
      parameters:
        - name: usercode
          in: path
          required: true
          schema: { type: string }
          description: Usercode displayed by the mobile app during registration.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteRegistrationEmailVerificationRequest' }
      responses:
        '501':
          description: >
            Not implemented. The response body is empty and nothing is written.
            This is the status the server returns today.
        '204':
          description: >
            Intended when this call is implemented. Pending registration email
            verification completed.
        '404':
          description: >
            Intended when this call is implemented. Registration or pending
            email verification not found.
        '409':
          description: >
            Intended when this call is implemented. Expected email does not
            match the pending registration email.

  /accounts/{usercode}/card-status:
    post:
      tags: [Implemented]
      summary: Change the physical card status for the mobile app's registration
      description: >
        The usercode is the confirmation number the mobile app showed during
        registration, the same value sent to POST /verifications/{usercode}/decision.
        That code stays with the registration when a new card is issued. The
        call changes the card that is still effective, including one issued
        later by renew or replace. Activated can be suspended or cancelled.
        Suspended can be unsuspended or cancelled. A deactivated card cannot
        be changed. The chip event is stored with reason "No reason provided"
        and no comment. This call does not change the mobile app or the
        username/password credential.
      security:
        - iasOAuth2: [test-idv-accounts]
      parameters:
        - name: usercode
          in: path
          required: true
          schema: { type: string }
          description: Usercode displayed by the mobile app during its registration flow.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeCardStatusRequest' }
      responses:
        '200':
          description: Card status changed. The response body is empty.
        '400':
          description: >
            The user code is blank or unknown, the registration has no card
            serial, cardEventType is missing, the card is not effective, or
            the current status cannot take the event.
        '401':
          description: Missing, expired, or invalid bearer token.
        '403':
          description: The token does not have scope test-idv-accounts.

  /accounts/mobile-app/{usercode}/status:
    post:
      tags: [Implemented]
      summary: Change a paired mobile app instance's (device credential) status
      description: >
        The usercode is the confirmation number the mobile app showed during
        registration, the same value sent to POST /verifications/{usercode}/decision.
        The caller does not send the next status. Activated becomes Suspended.
        Suspended becomes Activated. Any other credential status is rejected.
        reason is the remedy number stored in the status comment.
      security:
        - iasOAuth2: [test-idv-accounts]
      parameters:
        - name: usercode
          in: path
          required: true
          schema: { type: string }
          description: Usercode displayed by the mobile app during its registration flow.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeMobileAppStatusRequest' }
      responses:
        '200':
          description: Mobile app status changed. The response body is empty.
        '400':
          description: >
            The user code is blank, reason is missing or not a remedy number
            of 1 to 25 letters or digits, or the user code is not an Activated
            or Suspended mobile app.
        '401':
          description: Missing, expired, or invalid bearer token.
        '403':
          description: The token does not have scope test-idv-accounts.

  /accounts/mobile-app/{usercode}/expiry:
    post:
      tags: [Implemented]
      summary: Set a paired mobile app instance's expiry date (past, present, or future)
      description: >
        The usercode is the confirmation number the mobile app showed during
        registration, the same value sent to POST /verifications/{usercode}/decision.
        The device credential must be Activated. A past expiryDate also sets
        the credential status to Expired. A present or future expiryDate changes
        the date only.
      security:
        - iasOAuth2: [test-idv-accounts]
      parameters:
        - name: usercode
          in: path
          required: true
          schema: { type: string }
          description: Usercode displayed by the mobile app during its registration flow.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetMobileAppExpiryRequest' }
      responses:
        '200':
          description: >
            Expiry date stored. When expiryDate is strictly before the current
            time, the mobile app status is Expired. A present or future date
            leaves the app Activated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetMobileAppExpiryResponse' }
        '400':
          description: >
            The user code is blank, expiryDate is missing or not a date-time,
            or the user code is not an Activated mobile app.
        '401':
          description: Missing, expired, or invalid bearer token.
        '403':
          description: The token does not have scope test-idv-accounts.

  /accounts/{usercode}/card-renewal:
    post:
      tags: [Implemented]
      summary: Renew or replace the physical card registered to the mobile app
      description: >
        The usercode is the confirmation number the mobile app showed during
        registration, the same value sent to POST /verifications/{usercode}/decision.
        The call renews or replaces the current physical card for that
        registration. The card must be Activated or Deactivated. The response
        csn is the new card serial. The same cardExpiryDate as the current
        expiry is a replace for an Activated card. A date after today and
        after the current expiry is a renew. Name, gender, and address, when
        sent, replace the current values. Omitted fields stay as they are.
        A later call with the same user code renews or replaces the current card.
      security:
        - iasOAuth2: [test-idv-accounts]
      parameters:
        - name: usercode
          in: path
          required: true
          schema: { type: string }
          description: Usercode displayed by the mobile app during its registration flow.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CardRenewalRequest' }
      responses:
        '200':
          description: Renewal or replacement card issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CardRenewalResponse' }
        '400':
          description: >
            The user code is blank or unknown, the registration has no card
            serial, cardExpiryDate is missing or is not the current expiry and
            not after both today and the current expiry, an optional attribute
            is blank, gender is not M, F, X, or U, or the card is not an
            effective Activated or Deactivated card.
        '401':
          description: Missing, expired, or invalid bearer token.
        '403':
          description: The token does not have scope test-idv-accounts.

  /accounts/{csn}/address-update:
    post:
      tags: [Implemented]
      summary: Update the account address without issuing a new card
      description: >
        Updates the account address for the current card. It does not change
        the address printed on the card. A later renewal that omits the address
        keeps the last card address. The path is the current card serial; after
        a renew or replace, use the new serial. Saves mes.incoming_address_update
        with status Received and returns without waiting. AddressUpdateProcessor
        then runs on its own, the same way the ICBC card-address service does.
        The caller sends the address only. ICBC client id, PHN, card type, and
        card issue date are read from the effective card. Print pending is N
        and the source is Other. cardAddressEffectiveDate defaults to today.
      security:
        - iasOAuth2: [test-idv-accounts]
      parameters:
        - name: csn
          in: path
          required: true
          schema: { type: string }
          description: >
            Current card serial, as carried on the address feed. After a renew
            or replace, use the new serial.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressUpdateRequest' }
      responses:
        '200':
          description: >
            Address update accepted. The account address is not necessarily
            updated yet. status in the body is Received.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddressUpdateResponse' }
        '400':
          description: >
            The card serial is blank, a required address field is missing,
            the card serial has no effective chip-credential row, or that card
            has no ICBC client id, PHN, card issue date, or known card type.
        '401':
          description: Missing, expired, or invalid bearer token.
        '403':
          description: The token does not have scope test-idv-accounts.
