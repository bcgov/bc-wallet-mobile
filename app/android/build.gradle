// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        androidXBrowser = "1.5.0"
        javaVersion = JavaVersion.VERSION_17
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath('com.google.gms:google-services:4.4.4')
        classpath("com.facebook.react:react-native-gradle-plugin")
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects { project ->
    // When @animo-id/expo-secure-environment is pulled in during a local link to bifold 
    // it sets kotlinOptions.jvmTarget = "17" directly
    // But when RNGP's global Java/Kotlin alignment then tries to
    // set the same value again and Gradle throws "the value for property
    // 'languageVersion' is final and cannot be changed any further"
    // This check is a workaround to disable RNGP's global alignment for this specific project
    if (project.path == ':animo-id-expo-secure-environment') {
        project.ext.set('react.internal.disableJavaVersionAlignment', 'true')
    }

    repositories {
        mavenCentral()
        mavenLocal()
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url("$rootDir/../node_modules/react-native/android")
        }
        maven {
            // Android JSC is installed from npm
            url("$rootDir/../node_modules/jsc-android/dist")
        }

        google()
        maven { url 'https://www.jitpack.io' }
    }
}

subprojects {
    configurations.all {
       it.resolutionStrategy.activateDependencyLocking()
    }
}

dependencyLocking {
    lockAllConfigurations()
}
